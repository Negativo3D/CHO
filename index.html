<style>
  :root{

<body>
<h1 id="titolo">CHO</h1>
<main id="vista"></main>
<nav id="nav"></nav>
<div id="strati"></div>

<script>
/* Nessun alimento predefinito: l'elenco è costruito dall'utente
   (a mano, con il codice a barre o da una fotografia) e vive in localStorage. */
const CATS = ["Pane e cereali","Primi e patate","Frutta","Verdura e legumi","Latte e derivati","Dolci e snack","Fuori casa","Bevande","Zuccheri rapidi","Altro"];
function calcolaBolo(cho, grassi, proteine, igPrevalente) {
  const kcalGP = grassi * 9 + proteine * 4;
  const ugp = kcalGP / 100;

  let tipo, split, durata, spiega;

  if (cho < 5 && ugp < 1) {
    tipo = "Nessun bolo per i carboidrati";
    split = null; durata = null;
    spiega = "Il pasto contiene pochissimi carboidrati e pochi grassi.";
  } else if (ugp < 1) {
    tipo = "Bolo immediato";
    split = null; durata = null;
    spiega = "Pasto magro: l'assorbimento è rapido e si concentra nella prima ora.";
  } else if (ugp < 2) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "3 ore";
    spiega = "Grassi e proteine rallentano lo svuotamento gastrico: una coda di insulina copre la seconda fase.";
  } else if (ugp < 3) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "4 ore";
    spiega = "Quantità importante di grassi e proteine: il rialzo tardivo è la parte più difficile da coprire.";
  } else if (ugp < 4) {
    tipo = "Onda doppia";
    split = [50, 50]; durata = "5 ore";
    spiega = "Pasto ricco e lento. Metà insulina subito, metà distribuita sulle ore successive.";
  } else {
    tipo = "Onda doppia lunga";
    split = [50, 50]; durata = "6-8 ore";
    spiega = "Pasto molto grasso e abbondante: l'effetto sulla glicemia può durare tutta la sera e la notte.";
  }

  // Pochi carboidrati ma molti grassi/proteine: la quota immediata serve poco.
  if (cho < 15 && ugp >= 2) {
    tipo = "Onda quadra";
    split = null; durata = "4-6 ore";
    spiega = "Quasi nessun carboidrato rapido, ma un grande carico di grassi e proteine che alza la glicemia in ritardo.";
  }

  let prebolo;
  if (tipo === "Nessun bolo per i carboidrati") prebolo = null;
  else if (ugp >= 2) prebolo = "0-10 minuti prima";
  else if (igPrevalente === "alto") prebolo = "15-20 minuti prima";
  else if (igPrevalente === "medio") prebolo = "10-15 minuti prima";
  else prebolo = "0-10 minuti prima";

  return { ugp, tipo, split, durata, prebolo, spiega };
}

/* ---------------------------------------------------------------
   LOGICA SPORT
   Fasce orientative di carboidrati aggiuntivi e forma del profilo
   basale (riduzione percentuale e anticipo, mai unità) per attività
   aerobiche, in base a intensità, durata e fascia oraria.
   --------------------------------------------------------------- */
const ATTIVITA = {
  nuoto:    { nome:'Nuoto',    icona:'🏊', sotto:'Aerobica in acqua',        oraria:15, fattorePrima:1 },
  corsa:    { nome:'Corsa',    icona:'🏃', sotto:'Aerobica ad alto consumo', oraria:18, fattorePrima:1.2 },
  trekking: { nome:'Trekking', icona:'🥾', sotto:'Camminata lunga',          oraria:10, fattorePrima:0.8 }
};

function calcolaSport({ attivita, intensita, durata, fascia }) {
  const att = ATTIVITA[attivita] || ATTIVITA.nuoto;
  const fattoreInt = intensita === "leggera" ? 0.5 : intensita === "moderata" ? 1 : 1.4;
  const ore = durata / 60;

  // La mattina, spesso a digiuno, il fabbisogno prima di partire è più
  // basso; la sera la fascia sale perché l'insulina dei pasti della
  // giornata è più spesso ancora in circolo.
  let prima;
  if (fascia === "mattina") prima = [0, 15];
  else if (fascia === "sera") prima = [15, 30];
  else prima = [10, 25];
  prima = prima.map(x => Math.round(x * fattoreInt * att.fattorePrima));

  const durante = ore > 1 ? Math.round(att.oraria * fattoreInt * (ore - 0.5)) : 0;

  // Profilo basale: forma della riduzione temporanea e anticipo.
  let rid = intensita === "leggera" ? (durata <= 30 ? null : [10, 30])
    : intensita === "moderata" ? [30, 50] : [50, 70];
  if (rid && durata >= 90) rid = [Math.min(rid[0] + 10, 80), Math.min(rid[1] + 10, 80)];
  const basale = rid ? {
    profilo: `Basale temporanea ridotta del ${rid[0]}-${rid[1]}%`,
    anticipo: intensita === "leggera" ? "30-60 minuti prima"
      : intensita === "moderata" ? "60-90 minuti prima" : "Circa 90 minuti prima"
  } : {
    profilo: "Profilo abituale, nessuna riduzione",
    anticipo: "Nessun anticipo necessario"
  };

  return { prima, durante, basale };
}



/* ---------- icone ---------- */
const IC = {
  cerca:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  piatto:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/>',
  piatti:'<path d="M4 15h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 2 2.5 2 4.5M14 4c0 2 2 2.5 2 4.5"/>',
  sport:'<path d="M4 12h3l2-6 4 12 2-6h5"/>',
  stella:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  cestino:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  meno:'<path d="M5 12h14"/>', piu:'<path d="M12 5v14M5 12h14"/>', chiudi:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function ico(n, s=22, pieno=false){
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${pieno?'currentColor':'none'}"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
}

/* ---------- memoria sul telefono ---------- */
/* Numero di versione dell'app: va aumentato a ogni pubblicazione.
   Il controllo aggiornamenti confronta questo valore con quello online. */
const VERSIONE = '2026-09-04.9';

const CHIAVE = 'atlante-cho-v1';
function leggi(){ try{ return JSON.parse(localStorage.getItem(CHIAVE)) || {}; }catch(e){ return {}; } }
function scrivi(patch){
  try{ localStorage.setItem(CHIAVE, JSON.stringify({...leggi(), ...patch})); return true; }
  catch(e){ return false; }
}

function nuovoId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function sanificaAlimento(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if(typeof o.n !== 'string' || !o.n.trim()) return null;
  const num = v => { const x = +v; return isFinite(x) && x >= 0 ? Math.round(x*10)/10 : null; };
  const cho = num(o.cho);
  if(cho === null || cho > 100) return null;
  const porz = Array.isArray(o.porz) && o.porz.length &&
    o.porz.every(pz => Array.isArray(pz) && typeof pz[0] === 'string' && +pz[1] > 0)
    ? o.porz.map(pz => [pz[0], Math.round(+pz[1]*10)/10]) : [["100 g",100]];
  return {
    id: typeof o.id === 'string' && o.id ? o.id : nuovoId(),
    n: o.n.trim(),
    e: typeof o.e === 'string' && o.e.trim() ? Array.from(o.e.trim()).slice(0,3).join('') : '🍽️',
    cat: CATS.includes(o.cat) ? o.cat : 'Altro',
    cho, f: num(o.f) ?? 0, p: num(o.p) ?? 0,
    ig: ['basso','medio','alto'].includes(o.ig) ? o.ig : 'medio',
    ...(o.alcol === true ? {alcol:true} : {}),
    porz
  };
}

let FOODS = (leggi().alimenti || []).map(sanificaAlimento).filter(Boolean);

/* ---------- anagrafica piatti ----------
   Un piatto è una combinazione già porzionata di alimenti
   dell'anagrafica: ogni ingrediente ha una quantità di default a peso
   (es. pasta 90 g) o a pezzi (es. 2 pasticcini da 35 g). I CHO del
   piatto vengono calcolati dal database degli alimenti. */
function sanificaPiatto(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if(typeof o.n !== 'string' || !o.n.trim()) return null;
  const ing = (Array.isArray(o.ing) ? o.ing : []).map(i => {
    if(!i || typeof i !== 'object' || typeof i.alimento !== 'string') return null;
    if(i.modo === 'pezzi'){
      const pz = Math.round(+i.pezzi), gp = Math.round(+i.gPezzo*10)/10;
      return pz > 0 && gp > 0 ? { alimento:i.alimento, modo:'pezzi', pezzi:pz, gPezzo:gp } : null;
    }
    const g = Math.round(+i.g*10)/10;
    return g > 0 ? { alimento:i.alimento, modo:'g', g } : null;
  }).filter(Boolean);
  if(!ing.length) return null;
  return {
    id: typeof o.id === 'string' && o.id ? o.id : nuovoId(),
    n: o.n.trim(),
    e: typeof o.e === 'string' && o.e.trim() ? Array.from(o.e.trim()).slice(0,3).join('') : '🍽️',
    foto: typeof o.foto === 'string' && o.foto.startsWith('data:image') ? o.foto : null,
    ing
  };
}

let PIATTI = (leggi().piatti || []).map(sanificaPiatto).filter(Boolean);

const grIng = i => i.modo === 'pezzi' ? i.pezzi * i.gPezzo : i.g;
function totaliPiatto(ing){
  let cho = 0, f = 0, p = 0;
  for(const i of ing){
    const c = cibo(i.alimento); if(!c) continue;
    const g = grIng(i);
    cho += c.cho*g/100; f += c.f*g/100; p += c.p*g/100;
  }
  return { cho, f, p };
}

function fotoPiatto(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    try{
      const img = await createImageBitmap(file);
      const sc = Math.min(1, 480 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      if(S.pform){ S.pform.foto = cv.toDataURL('image/jpeg', .72); disegna(); }
    }catch(e){ alert('Non riesco a leggere questa immagine.'); }
  };
  inp.click();
}

/* ---------- esportazione in PDF ----------
   PDF generato a mano (nessuna libreria): font base Helvetica con
   codifica WinAnsi, quindi solo testo latino — le emoji vengono
   omesse. Una tabella per pagina A4, multi-pagina se serve. */
function pdfTesto(t){
  return String(t).normalize('NFC').split('')
    .filter(c => c.charCodeAt(0) >= 32 && c.charCodeAt(0) <= 255).join('')
    .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').trim();
}

function costruisciPdf(pagine){
  const oggetti = [];
  const idPagine = pagine.map((_, k) => 5 + 2*k);
  oggetti[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  oggetti[2] = `<< /Type /Pages /Kids [${idPagine.map(id => id + ' 0 R').join(' ')}] /Count ${pagine.length} >>`;
  oggetti[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  oggetti[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pagine.forEach((cont, k) => {
    oggetti[5 + 2*k] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + 2*k} 0 R >>`;
    oggetti[6 + 2*k] = { stream: cont };
  });
  let pdf = '%PDF-1.4\n';
  const offset = [];
  for(let i = 1; i < oggetti.length; i++){
    offset[i] = pdf.length;
    const o = oggetti[i];
    pdf += typeof o === 'string'
      ? `${i} 0 obj\n${o}\nendobj\n`
      : `${i} 0 obj\n<< /Length ${o.stream.length} >>\nstream\n${o.stream}endstream\nendobj\n`;
  }
  const xref = pdf.length;
  pdf += `xref\n0 ${oggetti.length}\n0000000000 65535 f \n`;
  for(let i = 1; i < oggetti.length; i++) pdf += String(offset[i]).padStart(10,'0') + ' 00000 n \n';
  pdf += `trailer\n<< /Size ${oggetti.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return Uint8Array.from(pdf, c => c.charCodeAt(0) & 0xFF);
}

function esportaDati(){
  if(!FOODS.length){ alert('Non ci sono ancora alimenti da esportare.'); return; }
  const dataIt = new Date().toLocaleDateString('it-IT');
  const ordinati = [...FOODS].sort((a,b) => a.n.localeCompare(b.n, 'it'));
  const col = [40, 330, 392, 452, 515];
  const perPagina = 38;
  const nPagine = Math.ceil(ordinati.length / perPagina);
  const pagine = [];
  for(let i = 0; i < nPagine; i++){
    let s = '';
    const T = (x, y, f, dim, testo) => { s += `BT /${f} ${dim} Tf ${x} ${y} Td (${pdfTesto(testo)}) Tj ET\n`; };
    let y = 782;
    if(i === 0){
      T(40, y, 'F2', 20, 'CHO - I miei alimenti'); y -= 18;
      T(40, y, 'F1', 10, `Esportato il ${dataIt} - ${ordinati.length} alimenti - valori per 100 g`); y -= 28;
    }
    T(col[0], y, 'F2', 10, 'Alimento'); T(col[1], y, 'F2', 10, 'CHO');
    T(col[2], y, 'F2', 10, 'Grassi'); T(col[3], y, 'F2', 10, 'Proteine');
    T(col[4], y, 'F2', 10, 'Porzione'); y -= 7;
    s += `0.6 w 40 ${y} m 555 ${y} l S\n`; y -= 15;
    for(const f of ordinati.slice(i*perPagina, (i+1)*perPagina)){
      T(col[0], y, 'F1', 10, f.n.slice(0, 46) + (f.alcol ? ' (alcol)' : ''));
      T(col[1], y, 'F1', 10, `${gr1(f.cho)} g`);
      T(col[2], y, 'F1', 10, `${gr1(f.f)} g`);
      T(col[3], y, 'F1', 10, `${gr1(f.p)} g`);
      T(col[4], y, 'F1', 10, f.porz[0][1] !== 100 ? `${gr1(f.porz[0][1])} g` : '-');
      y -= 17;
    }
    T(40, 34, 'F1', 8, `CHO - versione ${VERSIONE} - pagina ${i+1} di ${nPagine} - valori indicativi, verifica le etichette`);
    pagine.push(s);
  }
  const blob = new Blob([costruisciPdf(pagine)], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `atlante-cho-alimenti-${new Date().toISOString().slice(0,10)}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- aggiunta alimenti: scanner, foto, Open Food Facts ----------
   La lettura del codice a barre usa l'API BarcodeDetector dove c'è
   (Chrome/Android); altrove carica al volo la libreria ZXing, così la
   fotocamera funziona anche su iPhone/Safari. */
const FORMATI_BARCODE = ['ean_13','ean_8','upc_a','upc_e','code_128'];
let flussoCamera = null, cicloScan = null, rilevatore = null, zxReader = null, zxPromise = null;

function formVuoto(){
  return { n:'', e:'', cho:'', f:'', p:'', ig:'medio', alcol:'no', cat:'Altro', porz:'' };
}

const EMOJI_CIBO = ['🍞','🥐','🥖','🍝','🍚','🥔','🍕','🥪','🍔','🍎','🍌','🍊','🍇','🍓','🍑','🥝','🥦','🥕','🍅','🫘','🥛','🧀','🥣','🥚','🍖','🐟','🍪','🍫','🍰','🍨','🍯','🍬','🥤','🧃','🍺','🍷'];

const scannerAttivo = () => !!(flussoCamera || zxReader);

function caricaZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxPromise) return zxPromise;
  zxPromise = new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = () => window.ZXing ? ok() : ko(new Error('zxing'));
    s.onerror = () => { zxPromise = null; ko(new Error('rete')); };
    document.head.appendChild(s);
  });
  return zxPromise;
}

function msgErroreCamera(e){
  if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
    return "Il permesso per la fotocamera è stato negato. Riattivalo nelle impostazioni del browser per questo sito " +
      "(Android: menu ⋮ → Impostazioni sito → Fotocamera; iPhone: Impostazioni → Safari/app → Fotocamera), poi riprova. " +
      "In alternativa digita il codice qui sotto.";
  if(e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError'))
    return "Non trovo una fotocamera su questo dispositivo: digita il codice qui sotto o usa una foto del codice.";
  if(e && e.message === 'rete')
    return "Non riesco a scaricare il modulo di lettura (serve internet): digita il codice qui sotto.";
  return "Non riesco ad avviare la fotocamera: digita il codice qui sotto oppure usa una foto del codice.";
}

async function avviaScanner(){
  S.msgScanner = "Sto avviando la fotocamera…"; disegna();
  if(!window.isSecureContext){
    S.msgScanner = "La fotocamera funziona solo aprendo l'app da un indirizzo https: digita il codice qui sotto.";
    disegna(); return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    S.msgScanner = "Questo browser non dà accesso alla fotocamera: digita il codice qui sotto o usa una foto del codice.";
    disegna(); return;
  }
  try{
    if('BarcodeDetector' in window){
      rilevatore = rilevatore || new BarcodeDetector({ formats: FORMATI_BARCODE });
      flussoCamera = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      if(S.nuovo !== 'barcode'){ fermaScanner(); return; }
      S.msgScanner = ''; disegna();
      cicloScan = setInterval(async () => {
        const v = document.getElementById('anteprima');
        if(!v || !v.videoWidth || S.caricamento) return;
        try{
          const codici = await rilevatore.detect(v);
          if(codici.length){
            fermaScanner();
            S.codice = codici[0].rawValue;
            cercaCodice(S.codice);
          }
        }catch(e){}
      }, 350);
    } else {
      await caricaZXing();
      if(S.nuovo !== 'barcode') return;
      zxReader = new ZXing.BrowserMultiFormatReader();
      S.msgScanner = ''; disegna();
      const aColpo = (ris) => {
        if(!ris || S.caricamento) return;
        const c = ris.getText();
        fermaScanner();
        S.codice = c;
        cercaCodice(c);
      };
      if(zxReader.decodeFromConstraints)
        await zxReader.decodeFromConstraints({ video:{ facingMode:'environment' } }, 'anteprima', aColpo);
      else
        await zxReader.decodeFromVideoDevice(undefined, 'anteprima', aColpo);
    }
  }catch(e){
    fermaScanner();
    S.msgScanner = msgErroreCamera(e);
    disegna();
  }
}

function fermaScanner(){
  if(cicloScan){ clearInterval(cicloScan); cicloScan = null; }
  if(flussoCamera){ flussoCamera.getTracks().forEach(t => t.stop()); flussoCamera = null; }
  if(zxReader){ try{ zxReader.reset(); }catch(e){} zxReader = null; }
}

function fotoBarcode(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    let codice = null;
    try{
      if('BarcodeDetector' in window){
        const img = await createImageBitmap(file);
        rilevatore = rilevatore || new BarcodeDetector({ formats: FORMATI_BARCODE });
        const codici = await rilevatore.detect(img);
        if(codici.length) codice = codici[0].rawValue;
      } else {
        await caricaZXing();
        const url = URL.createObjectURL(file);
        try{
          const ris = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);
          codice = ris.getText();
        }catch(e){ /* nessun codice leggibile */ }
        finally{ URL.revokeObjectURL(url); }
      }
    }catch(e){
      alert(e && e.message === 'rete'
        ? "Per leggere la foto serve internet la prima volta: controlla la connessione e riprova, oppure digita il codice."
        : "Non riesco a leggere questa immagine.");
      return;
    }
    if(!codice){
      alert("Nella foto non si legge nessun codice a barre. Riprova con una foto nitida e ravvicinata del codice, oppure digitalo.");
      S.nuovo = 'barcode'; S.msgScanner = ''; disegna(); return;
    }
    fermaScanner();
    S.nuovo = 'barcode'; S.codice = codice; S.msgScanner = ''; disegna();
    cercaCodice(codice);
  };
  inp.click();
}

async function cercaCodice(codice){
  codice = String(codice || '').trim();
  if(!/^\d{6,14}$/.test(codice)){ alert("Inserisci un codice a barre valido (solo cifre)."); return; }
  S.nuovo = 'barcode'; S.caricamento = true; disegna();
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codice}.json?fields=product_name,product_name_it,nutriments`);
    const j = await r.json();
    S.caricamento = false;
    if(!j.product || !j.status){
      alert("Prodotto non trovato su Open Food Facts. Puoi inserirlo a mano.");
      disegna(); return;
    }
    const nu = j.product.nutriments || {};
    const num = x => (typeof x === 'number' && isFinite(x) && x >= 0) ? String(Math.round(x*10)/10) : '';
    fermaScanner();
    S.form = { ...formVuoto(),
      n: j.product.product_name_it || j.product.product_name || '',
      cho: num(nu.carbohydrates_100g), f: num(nu.fat_100g), p: num(nu.proteins_100g),
      alcol: (+nu.alcohol_100g || 0) > 0 ? 'si' : 'no'
    };
    S.editId = null; S.nuovo = 'form';
    disegna();
    if(!S.form.cho) alert("Il prodotto è stato trovato ma i carboidrati per 100 g non sono indicati: completali tu dall'etichetta.");
  }catch(e){
    S.caricamento = false;
    alert("Ricerca non riuscita: controlla la connessione a internet e riprova, oppure inserisci l'alimento a mano.");
    disegna();
  }
}

function salvaAlimento(){
  const F = S.form; if(!F) return;
  const dec = v => parseFloat(String(v).replace(',','.'));
  const nome = F.n.trim();
  const cho = dec(F.cho);
  if(!nome){ alert("Dai un nome all'alimento."); return; }
  if(!(cho >= 0 && cho <= 100)){ alert("Indica i carboidrati per 100 g: un numero da 0 a 100."); return; }
  const num = v => { const x = dec(v); return x >= 0 && x <= 100 ? Math.round(x*10)/10 : 0; };
  const porzG = Math.round(dec(F.porz)*10)/10;
  const dati = sanificaAlimento({
    id: S.editId || undefined,
    n: nome, e: F.e, cat: F.cat,
    cho: Math.round(cho*10)/10, f: num(F.f), p: num(F.p),
    ig: F.ig, alcol: F.alcol === 'si',
    porz: porzG > 0 ? [["1 porzione", porzG], ["100 g", 100]] : [["100 g", 100]]
  });
  if(S.editId){
    const i = FOODS.findIndex(x => x.id === S.editId);
    if(i >= 0) FOODS[i] = dati; else FOODS.push(dati);
  } else {
    FOODS.push(dati);
  }
  scrivi({ alimenti: FOODS });
  S.nuovo = null; S.form = null; S.editId = null;
  disegna();
}

const gr1 = x => { const v = Math.round(x*10)/10; return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',','); };
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

  return (S.aperto ? stratoPorzione() : '') + stratoNuovo() + stratoPiattoUso() + stratoPiattoForm()

function salvaPiatto(){
  const F = S.pform; if(!F) return;
  if(!F.n.trim()){ alert('Dai un nome al piatto.'); return; }
  const dati = sanificaPiatto({ id: S.editPiattoId || undefined, n:F.n, e:F.e, foto:F.foto, ing:F.ing });
  if(!dati){ alert('Aggiungi almeno un ingrediente con una quantità valida.'); return; }
  const nuovi = [...PIATTI];
  if(S.editPiattoId){
    const i = nuovi.findIndex(x => x.id === S.editPiattoId);
    if(i >= 0) nuovi[i] = dati; else nuovi.push(dati);
  } else nuovi.push(dati);
  if(!scrivi({ piatti: nuovi })){
    alert('Spazio sul telefono esaurito: prova a togliere la foto o a usarne una più piccola.');
    return;
  }
  PIATTI = nuovi;
  S.pform = null; S.editPiattoId = null; S.pingQ = '';
  disegna();
}

  if(S.nuovo === 'barcode') return `
  <div class="velo" data-a="chiudiNuovo">
    <div class="foglio" data-stop="1">
      ${testa('Codice a barre')}
      ${scannerAttivo() ? `
        <video id="anteprima" autoplay playsinline muted
          style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px;background:#000;margin-bottom:8px"></video>
        <div style="font-size:14px;color:var(--ink2);text-align:center;margin-bottom:12px">Inquadra il codice a barre della confezione</div>`
      : (S.msgScanner ? `<div class="avvisoBox" style="background:var(--card);border:1px solid var(--line);color:var(--ink2)">
          <span>ℹ️</span><span>${S.msgScanner}</span></div>` : '')}
      <div style="display:flex;gap:8px">
        <input id="fbarcode" class="campo" style="flex:1" inputmode="numeric" placeholder="Oppure digita il codice" value="${esc(S.codice)}">
        <button class="primario" style="width:auto;padding:0 20px" data-a="cercaCodice">Cerca</button>
      </div>
      ${S.caricamento ? `<div style="text-align:center;color:var(--ink2);font-size:14px;padding:12px 0 0">Cerco il prodotto su Open Food Facts…</div>` : ''}
    </div>
  </div>`;

  const F = S.form || formVuoto();
  const numero = (id, lab, val, ph) => `
    <div style="flex:1;min-width:0"><div class="etich">${lab}</div>
      <input id="${id}" class="campo" inputmode="decimal" placeholder="${ph||'0'}" value="${esc(val)}"></div>`;
  return `
  <div class="velo" data-a="chiudiNuovo">
    <div class="foglio" data-stop="1">
      ${testa(S.editId ? 'Modifica alimento' : 'Nuovo alimento')}
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <div style="flex:1"><div class="etich">Nome</div>
          <input id="fi-n" class="campo" placeholder="Es. Pane di segale" value="${esc(F.n)}"></div>
        <div style="width:84px"><div class="etich">Emoji</div>
          <input id="fi-e" class="campo" style="text-align:center" placeholder="🍽️" value="${esc(F.e)}"></div>
      </div>
      <div class="chips-wrap" style="margin-bottom:12px;gap:6px">
        ${EMOJI_CIBO.map(em => `<button class="chip ${F.e===em?'on':''}" data-a="fset:e:${em}"
          style="font-size:19px;padding:6px 10px;line-height:1">${em}</button>`).join('')}
      </div>
      <div class="etich">Valori per 100 g</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${numero('fi-cho','Carboidrati', F.cho)}
        ${numero('fi-f','Grassi', F.f)}
        ${numero('fi-p','Proteine', F.p)}
      </div>
      <div class="etich">Contiene alcol</div>
      <div class="chips-wrap" style="margin-bottom:12px">
        ${[['no','No'],['si','Sì']].map(([v,t]) => chip(t, F.alcol===v, `fset:alcol:${v}`)).join('')}</div>
      <div class="etich">Categoria</div>
      <div class="chips-wrap" style="margin-bottom:12px">
        ${CATS.map(c => chip(c, F.cat===c, `fset:cat:${c}`)).join('')}</div>
      <div style="margin-bottom:16px;max-width:200px"><div class="etich">Porzione tipica in grammi (facoltativa)</div>
        <input id="fi-porz" class="campo" inputmode="decimal" placeholder="es. 62,5" value="${esc(F.porz)}"></div>
      <button class="primario" data-a="salvaAlimento">${S.editId ? 'Salva le modifiche' : 'Aggiungi ai miei alimenti'}</button>
    </div>
  </div>`;
}

function stratoAvviso(){
  return `
  <div class="centro">
    <div class="modale">
      <div style="font-size:28px">⚠️</div>
      <div style="font-size:20px;font-weight:700;margin:8px 0 10px">Uno strumento di conteggio, non di dosaggio</div>
      <p style="font-size:14px;color:var(--ink2)">Questa app calcola i grammi di carboidrati di un pasto e suggerisce
      una forma di bolo. Non calcola unità di insulina: quelle restano al microinfusore, con i rapporti impostati dal
      tuo diabetologo.</p>
      <p style="font-size:14px;color:var(--ink2);margin-bottom:20px">I valori degli alimenti sono indicativi e cambiano
      con marca, ricetta e cottura. Verifica sempre le etichette e concorda schemi e correzioni con il tuo team.</p>
      <button class="primario" style="background:var(--ink)" data-a="ok">Ho capito</button>
    </div>
  </div>`;
}

/* ---------- disegno ---------- */
const TABS = [['atlante','Alimenti','cerca'],['piatti','Piatti','piatti'],['pasto','Pasto','piatto'],['sport','Sport','sport']];
const TITOLI = {atlante:'CHO', piatti:'I miei piatti', pasto:'Il tuo pasto', sport:'Attività fisica'};

function disegna(){
  const h = document.getElementById('titolo');
  h.textContent = TITOLI[S.tab];
  h.style.display = S.tab === 'atlante' ? 'none' : '';
  const v = document.getElementById('vista');
  /* Le animazioni d'ingresso partono solo cambiando schermata, non a ogni tocco. */
  v.classList.toggle('anim', S.tab !== disegna.ultimoTab);
  disegna.ultimoTab = S.tab;
  v.innerHTML = S.tab==='atlante' ? vistaAtlante() : S.tab==='piatti' ? vistaPiatti()
    : S.tab==='pasto' ? vistaPasto() : vistaSport();
  document.getElementById('nav').innerHTML = TABS.map(([id,l,i]) => `
    <button class="${S.tab===id?'on':''}" data-a="tab:${id}">
      <span class="ic">${ico(i)}</span><span class="lab">${l}</span>
      ${id==='pasto' && S.pasto.length ? `<span class="badge">${S.pasto.length}</span>` : ''}
    </button>`).join('');
  document.getElementById('strati').innerHTML =
    stratiHTML();
  if(S.nuovo === 'barcode' && flussoCamera){
    const vd = document.getElementById('anteprima');
    if(vd && !vd.srcObject) vd.srcObject = flussoCamera;
  }
  /* Il lettore ZXing gestisce da solo il proprio <video>. */
}

/* ---------- interazioni ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.classList.contains('velo') && e.target !== b) return;
  const [a, p1, p2] = b.dataset.a.split(':');

  if(a==='tab') S.tab = p1;
  else if(a==='cat') S.cat = p1;
  else if(a==='fav'){
    S.preferiti = S.preferiti.includes(p1) ? S.preferiti.filter(x=>x!==p1) : [...S.preferiti, p1];
    scrivi({preferiti: S.preferiti});
  }
  else if(a==='apri'){ S.aperto = p1; S.gr = cibo(p1).porz[0][1]; }
  else if(a==='chiudi') S.aperto = null;
  else if(a==='g'){
    const passo = S.gr>=100 ? 10 : S.gr>=25 ? 5 : S.gr>=5 ? 1 : 0.5;
    S.gr = Math.round((p1==='+' ? S.gr+passo : Math.max(0.5, S.gr-passo))*10)/10;
  }
  else if(a==='gset') S.gr = +p1;
  else if(a==='aggiungi'){ S.pasto.push({cibo: cibo(S.aperto), g: S.gr}); S.aperto = null; }
  else if(a==='togli') S.pasto.splice(+p1,1);
  else if(a==='svuota') S.pasto = [];
  else if(a==='sp'){ S.sport[p1] = isNaN(+p2) ? p2 : +p2; }
  else if(a==='att') S.sport.attivita = p1 || null;
  else if(a==='nuovo') S.nuovo = 'menu';
  else if(a==='chiudiNuovo'){ fermaScanner(); S.nuovo = null; S.form = null; S.editId = null; S.caricamento = false; }
  else if(a==='nuovoForm'){ S.form = formVuoto(); S.editId = null; S.nuovo = 'form'; }
  else if(a==='nuovoBarcode'){ S.nuovo = 'barcode'; S.codice = ''; S.caricamento = false; avviaScanner(); }
  else if(a==='nuovoFoto'){ fotoBarcode(); return; }
  else if(a==='cercaCodice'){ fermaScanner(); cercaCodice(S.codice); return; }
  else if(a==='salvaAlimento'){ salvaAlimento(); return; }
  else if(a==='fset'){ if(S.form) S.form[p1] = p2; }
  else if(a==='modifica'){
    const f = cibo(p1);
    if(f){
      S.form = { n:f.n, e:f.e, cho:String(f.cho), f:String(f.f), p:String(f.p),
        ig:f.ig, alcol:f.alcol ? 'si' : 'no', cat:f.cat || 'Altro',
        porz: f.porz[0][1] !== 100 ? String(f.porz[0][1]) : '' };
      S.editId = p1; S.nuovo = 'form'; S.aperto = null;
    }
  }
  else if(a==='elimina'){
    const f = cibo(p1);
    const usato = PIATTI.some(pl => pl.ing.some(i => i.alimento === p1));
    if(f && confirm(`Eliminare "${f.n}" dai tuoi alimenti?${usato ? ' Verrà tolto anche dai piatti che lo usano.' : ''}`)){
      FOODS = FOODS.filter(x => x.id !== p1);
      S.preferiti = S.preferiti.filter(x => x !== p1);
      PIATTI = PIATTI.map(pl => ({...pl, ing: pl.ing.filter(i => i.alimento !== p1)})).filter(pl => pl.ing.length);
      scrivi({ alimenti: FOODS, preferiti: S.preferiti, piatti: PIATTI });
      S.aperto = null;
      if(S.cat !== 'Tutti' && S.cat !== 'Preferiti' && !FOODS.some(x => x.cat === S.cat)) S.cat = 'Tutti';
    }
  }
  else if(a==='nuovoPiatto'){
    if(!FOODS.length){ alert('Prima aggiungi qualche alimento alla tua anagrafica: i piatti si compongono da lì.'); return; }
    S.pform = { n:'', e:'', foto:null, ing:[] }; S.editPiattoId = null; S.pingQ = '';
  }
  else if(a==='apriPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl) S.uso = { id: pl.id, ing: pl.ing.map(i => ({...i})) };
  }
  else if(a==='chiudiPiatto'){ S.uso = null; S.pform = null; S.editPiattoId = null; S.pingQ = ''; }
  else if(a==='usoq'){
    const i = S.uso && S.uso.ing[+p1];
    if(i){
      if(i.modo === 'pezzi') i.pezzi = Math.max(0, i.pezzi + (p2==='+' ? 1 : -1));
      else{
        const passo = i.g >= 100 ? 10 : 5;
        i.g = Math.max(0, Math.round((i.g + (p2==='+' ? passo : -passo))*10)/10);
      }
    }
  }
  else if(a==='usoAggiungi'){
    if(S.uso){
      let n = 0;
      for(const i of S.uso.ing){
        const c = cibo(i.alimento), g = grIng(i);
        if(c && g > 0){ S.pasto.push({ cibo:{...c}, g: Math.round(g*10)/10 }); n++; }
      }
      S.uso = null;
      if(n) S.tab = 'pasto';
    }
  }
  else if(a==='modificaPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl){ S.pform = { n:pl.n, e:pl.e, foto:pl.foto, ing: pl.ing.map(i => ({...i})) }; S.editPiattoId = p1; S.uso = null; S.pingQ = ''; }
  }
  else if(a==='eliminaPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl && confirm(`Eliminare il piatto "${pl.n}"?`)){
      PIATTI = PIATTI.filter(x => x.id !== p1);
      scrivi({ piatti: PIATTI });
      S.uso = null;
    }
  }
  else if(a==='pfoto'){ fotoPiatto(); return; }
  else if(a==='pfotoX'){ if(S.pform) S.pform.foto = null; }
  else if(a==='pingAdd'){
    const c = cibo(p1);
    if(c && S.pform && !S.pform.ing.some(i => i.alimento === c.id)){
      S.pform.ing.push({ alimento:c.id, modo:'g', g: c.porz[0][1] });
      S.pingQ = '';
    }
  }
  else if(a==='pingTogli'){ if(S.pform) S.pform.ing.splice(+p1, 1); }
  else if(a==='pingModo'){
    const i = S.pform && S.pform.ing[+p1];
    if(i && i.modo !== p2){
      if(p2 === 'pezzi'){ i.modo = 'pezzi'; i.pezzi = 1; i.gPezzo = +i.g > 0 ? i.g : 100; delete i.g; }
      else { i.modo = 'g'; i.g = +i.pezzi > 0 && +i.gPezzo > 0 ? Math.round(i.pezzi*i.gPezzo*10)/10 : 100; delete i.pezzi; delete i.gPezzo; }
    }
  }
  else if(a==='salvaPiatto'){ salvaPiatto(); return; }
  else if(a==='esporta'){ esportaDati(); return; }
  else if(a==='ok') scrivi({avvisoVisto:true});
  disegna();
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if(id === 'q'){
    S.q = e.target.value;
    const v = document.getElementById('vista');
    v.innerHTML = vistaAtlante();
    const q = document.getElementById('q');
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
  else if(id === 'fbarcode') S.codice = e.target.value;
  else if(id.startsWith('fi-') && S.form) S.form[id.slice(3)] = e.target.value;
  else if(id === 'pf-n' && S.pform) S.pform.n = e.target.value;
  else if(id === 'pf-e' && S.pform) S.pform.e = e.target.value;
  else if(id === 'pf-cerca' && S.pform){
    S.pingQ = e.target.value;
    document.getElementById('strati').innerHTML = stratiHTML();
    const c = document.getElementById('pf-cerca');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }
  else if(id.startsWith('pi-') && S.pform){
    const [, tipo, k] = id.split('-');
    const i = S.pform.ing[+k];
    if(i){
      const v = parseFloat(String(e.target.value).replace(',','.'));
      const num = isFinite(v) ? v : 0;
      if(tipo === 'g') i.g = num;
      else if(tipo === 'pz') i.pezzi = num;
      else if(tipo === 'gp') i.gPezzo = num;
    }
  }
});

disegna();

/* ---------- controllo aggiornamenti ----------
   La shortcut in home spesso riapre la pagina rimasta in memoria senza
   ricaricarla, e GitHub Pages tiene la pagina in cache ~10 minuti: qui
   si controlla la versione online (all'avvio, quando l'app torna in
   primo piano e ogni 15 minuti) e, se è diversa, compare un banner che
   ricarica la pagina scavalcando la cache. */
async function controllaAggiornamenti(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch(location.pathname + '?agg=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/VERSIONE = '([^']+)'/);
    if(m && m[1] !== VERSIONE) mostraBannerAggiorna();
  }catch(e){}
}
function mostraBannerAggiorna(){
  if(document.getElementById('agg')) return;
  const b = document.createElement('button');
  b.id = 'agg';
  b.textContent = '✨ Nuova versione disponibile — tocca per aggiornare';
  b.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;z-index:60;' +
    'padding:14px;border-radius:18px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;' +
    'box-shadow:0 10px 30px rgba(19,32,25,.35);animation:su .4s ease both';
  b.onclick = () => location.replace(location.pathname + '?v=' + Date.now());
  document.body.appendChild(b);
}
controllaAggiornamenti();
document.addEventListener('visibilitychange', () => { if(!document.hidden) controllaAggiornamenti(); });
setInterval(controllaAggiornamenti, 15 * 60 * 1000);
</script>
