<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CHO</title>
<meta name="theme-color" content="#0E7A57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHO">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#F2F4F1; --card:#FFFFFF; --ink:#132019; --ink2:#4A5A50; --line:#DDE3DC;
    --cho:#0E7A57; --cho-soft:#E3F2EB; --wave:#A85B0C; --wave-soft:#FBEFDD;
    --sport:#4B4FB8; --sport-soft:#E8E9F8; --hypo:#B02418; --hypo-soft:#FBE7E4;
    --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#EAF2EC 0%,var(--bg) 320px); color:var(--ink); font-family:var(--font);
    padding-top:env(safe-area-inset-top);
    -webkit-text-size-adjust:100%;
  }
  button{transition:transform .12s ease}
  button:active{transform:scale(.96)}
  @keyframes su{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .anim .hero{animation:su .45s ease both}
  .anim .cerca{animation:su .45s ease .06s both}
  .anim .chips{animation:su .45s ease .1s both}
  .anim .cella{animation:su .4s ease both}
  .anim .tile{animation:su .4s ease both}
  .anim .totale{animation:su .45s ease both}
  .anim>.card{animation:su .45s ease .05s both}
  .anim .box{animation:su .45s ease .1s both}
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:0;padding:20px 16px 8px}

  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(140deg,#16B47E 0%,#0E8A61 40%,#0A5C41 85%);
    border-radius:30px;padding:24px 20px;color:#fff;margin:14px 0;
    box-shadow:0 14px 34px rgba(14,122,87,.35)
  }
  .hero::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);top:-90px;right:-60px}
  .hero::after{content:'';position:absolute;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);bottom:-70px;left:-45px}
  .hero>*{position:relative;z-index:1}
  .hero .occhiello{font-size:11px;font-weight:700;letter-spacing:1.5px;opacity:.75;text-transform:uppercase}
  .hero .titolone{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:4px;line-height:1.12}
  .hero .datali{font-size:13px;font-weight:600;opacity:.8;margin-top:6px;text-transform:capitalize}
  .hero.blu{background:linear-gradient(140deg,#2D9BD8 0%,#1C6FA8 45%,#12496F 100%);
    box-shadow:0 14px 34px rgba(28,111,168,.4)}
  .hero.viola{background:linear-gradient(140deg,#7A7EF0 0%,#4B4FB8 45%,#34378C 100%);
    box-shadow:0 14px 34px rgba(75,79,184,.4)}

  .attivita{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
  .tile{
    position:relative;overflow:hidden;border-radius:24px;padding:20px 6px 16px;color:#fff;
    background:linear-gradient(150deg,#7A7EF0,#4B4FB8 55%,#34378C);
    box-shadow:0 10px 24px rgba(75,79,184,.35);
    display:flex;flex-direction:column;align-items:center;gap:9px
  }
  .tile::before{content:'';position:absolute;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,0) 70%);top:-40px;right:-30px}
  .tile .em{font-size:40px;line-height:1;position:relative}
  .tile .nomeT{font-weight:800;font-size:13px;letter-spacing:.8px;position:relative}

  .tparam{width:100%;border-collapse:separate;border-spacing:4px 6px;table-layout:fixed}
  .tparam thead th{font-size:11px;font-weight:600;color:var(--ink2);text-align:center;padding:0 2px}
  .tparam thead th:first-child, .tparam tbody th{width:76px;text-align:left;font-size:12px;
    font-weight:600;color:var(--ink2);white-space:nowrap;padding:0}
  .tparam input{width:100%;padding:10px 2px;text-align:center;border:1px solid var(--line);border-radius:12px;
    background:var(--card);font-size:16px;font-weight:600;color:var(--ink);outline:none;
    font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .tparam input::-webkit-outer-spin-button,.tparam input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .tparam input:focus{border-color:var(--sport)}

  .eroeViola{
    position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(140deg,#7A7EF0 0%,#4B4FB8 45%,#34378C 100%);
    box-shadow:0 14px 30px rgba(75,79,184,.35)
  }
  .eroeViola::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 70%);top:-70px;right:-50px}
  .eroeViola>*{position:relative}

  .emt{width:46px;height:46px;border-radius:15px;background:var(--cho-soft);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cella{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:14px;box-shadow:0 4px 14px rgba(19,32,25,.06)
  }
  .cella .apri{display:block;width:100%;text-align:left}
  .cella .emg{
    width:54px;height:54px;border-radius:18px;background:var(--cho-soft);
    display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1
  }
  .cella .nome2{
    font-weight:650;font-size:14px;line-height:1.25;margin:9px 0 8px;min-height:35px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .chopill{
    display:inline-block;background:linear-gradient(135deg,#12996E,#0A5C41);color:#fff;
    font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px;
    box-shadow:0 3px 8px rgba(14,122,87,.25)
  }
  .cella .stella{position:absolute;top:6px;right:6px}

  .fab{
    position:fixed;right:18px;bottom:calc(94px + env(safe-area-inset-bottom));
    width:60px;height:60px;border-radius:22px;color:#fff;z-index:30;
    background:linear-gradient(135deg,#16B47E,#0A5C41);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(14,122,87,.45), 0 0 0 6px rgba(14,122,87,.08)
  }
  /* Stessa grafica del vecchio pulsante flottante, ma ancorato in alto
     a destra della testata (Home e Pasto). */
  .fab.fabHero{position:absolute;top:16px;right:16px;bottom:auto;left:auto;width:52px;height:52px;
    border-radius:19px;z-index:2;
    box-shadow:0 8px 20px rgba(6,50,35,.35), 0 0 0 5px rgba(255,255,255,.14)}
  main{padding:0 16px 150px}
  /* In Sport non c'è il pulsante flottante: meno aria in fondo, così
     il dettaglio attività sta in una videata senza scorrere. */
  body[data-tab="sport"] main{padding-bottom:104px}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input{font-family:inherit}
  textarea.campo{font-family:inherit;resize:none;line-height:1.5;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px}
  .riga{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
  .riga .em{font-size:30px;line-height:1}
  .riga .nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .riga .sotto{font-size:12px;color:var(--ink2)}
  .cerca{position:relative;margin-bottom:12px}
  .cerca input{
    width:100%;padding:15px 16px 15px 44px;border-radius:18px;border:1px solid var(--line);
    background:var(--card);font-size:16px;color:var(--ink);outline:none
  }
  .cerca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink2)}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;padding:8px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
  .seg button.on{background:var(--cho);color:#fff;box-shadow:0 3px 8px rgba(14,122,87,.3)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;
    background:var(--card);border:1px solid var(--line);color:var(--ink2)
  }
  .chip.on{background:var(--c,var(--cho));border-color:var(--c,var(--cho));color:#fff;font-weight:600;
    box-shadow:0 4px 12px rgba(19,32,25,.16)}
  .chips-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stella{padding:8px;color:#C3CCC5}
  .stella.on{color:var(--wave)}
  .num{font-variant-numeric:tabular-nums}

  .totale{
    position:relative;overflow:hidden;color:#fff;text-align:center;margin:14px 0 16px;
    background:linear-gradient(140deg,#16B47E 0%,#0E8A61 45%,#0A5C41 100%);
    border-radius:30px;padding:26px 24px;
    box-shadow:0 14px 34px rgba(14,122,87,.35)
  }
  .totale::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 70%);top:-80px;right:-55px}
  .totale>*{position:relative}
  .totale .big{font-size:64px;font-weight:800;line-height:1}
  .box{border-radius:24px;padding:20px;margin-bottom:16px}
  .avvisoBox{display:flex;gap:8px;font-size:14px;border-radius:18px;padding:14px;margin-bottom:16px;line-height:1.5}

  nav{
    position:fixed;left:12px;right:12px;bottom:calc(6px + env(safe-area-inset-bottom));
    display:flex;gap:3px;padding:6px;background:rgba(17,28,22,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:999px;z-index:20;
    box-shadow:0 16px 36px rgba(19,32,25,.4)
  }
  nav button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:#8EA396;position:relative;border-radius:999px;transition:background .18s ease,color .18s ease}
  nav button.on{color:#fff;background:linear-gradient(135deg,#16B47E,#0A5C41);
    box-shadow:0 6px 16px rgba(14,122,87,.45)}
  nav .ic{display:flex;align-items:center;justify-content:center}
  nav .lab{font-size:10px;font-weight:600;letter-spacing:.2px}
  nav button.on .lab{font-weight:700}

  .velo{position:fixed;inset:0;background:rgba(19,32,25,.5);z-index:40;display:flex;align-items:flex-end}
  .foglio{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 20px 34px;max-height:88vh;overflow-y:auto}
  /* Foglio a schermo pieno (es. lettura ricetta): sale tutto, non a metà. */
  .foglio.pieno{height:100vh;height:100dvh;max-height:none;border-radius:0;
    padding-top:calc(16px + env(safe-area-inset-top))}
  .stepper{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .stepper button{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600}
  .primario{width:100%;padding:16px;border-radius:18px;background:var(--cho);color:#fff;font-weight:700;font-size:17px}
  .campo{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);
    font-size:16px;color:var(--ink);outline:none}
  .etich{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px}
  .centro{position:fixed;inset:0;background:rgba(19,32,25,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .modale{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%}
  ul{margin:8px 0 0;padding-left:18px}
  li{margin-bottom:8px;font-size:14px;line-height:1.5}
  p{line-height:1.55;margin:0 0 10px}

  /* ---------- splash di avvio ---------- */
  #splash{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(140deg,#16B47E 0%,#0E8A61 40%,#0A5C41 85%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .5s ease, visibility .5s ease
  }
  #splash.via{opacity:0;visibility:hidden;pointer-events:none}
  .s-piatto{
    position:relative;width:150px;height:150px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 50px rgba(6,50,35,.4), inset 0 0 0 10px #F2F4F1, inset 0 0 0 11px #DDE3DC;
    animation:s-pop .55s cubic-bezier(.34,1.56,.64,1) both
  }
  .s-logo{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--cho)}
  .s-orbita{position:absolute;inset:-46px;animation:s-gira 10s linear infinite}
  .s-orbita span{position:absolute;left:50%;top:50%;width:0;height:0;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(var(--a)) translateY(-121px)}
  .s-orbita b{font-size:29px;line-height:1;font-weight:400;
    animation:s-controgira 10s linear infinite}
  .s-orbita i{display:block;font-style:normal;animation:s-pop .5s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay:var(--r)}
  @keyframes s-gira{to{transform:rotate(360deg)}}
  @keyframes s-controgira{
    from{transform:rotate(calc(var(--a) * -1))}
    to{transform:rotate(calc(var(--a) * -1 - 360deg))}
  }
  @keyframes s-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  .s-tag{color:#fff;opacity:.82;font-size:12px;font-weight:700;letter-spacing:2.5px;
    text-transform:uppercase;margin-top:58px;animation:s-pop .5s ease .35s both}
  .s-punti{display:flex;gap:8px;animation:s-pop .5s ease .5s both}
  .s-punti i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);
    animation:s-salta 1s ease-in-out infinite;animation-delay:var(--r)}
  @keyframes s-salta{0%,60%,100%{transform:none;opacity:.55}30%{transform:translateY(-8px);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    #splash *{animation-duration:.01s !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="s-piatto">
    <div class="s-orbita">
      <span style="--a:0deg"><b><i style="--r:.10s">🍞</i></b></span>
      <span style="--a:60deg"><b><i style="--r:.18s">🍎</i></b></span>
      <span style="--a:120deg"><b><i style="--r:.26s">🍝</i></b></span>
      <span style="--a:180deg"><b><i style="--r:.34s">🥛</i></b></span>
      <span style="--a:240deg"><b><i style="--r:.42s">🥦</i></b></span>
      <span style="--a:300deg"><b><i style="--r:.50s">🍪</i></b></span>
    </div>
    <div class="s-logo">CHO</div>
  </div>
  <div class="s-tag">Conteggio carboidrati</div>
  <div class="s-punti"><i style="--r:0s"></i><i style="--r:.15s"></i><i style="--r:.3s"></i></div>
</div>
<h1 id="titolo">CHO</h1>
<main id="vista"></main>
<nav id="nav"></nav>
<div id="strati"></div>

<script>
/* L'elenco alimenti vive in localStorage: parte da una piccola base di
   partenza (vedi ALIMENTI_BASE) e cresce con gli inserimenti dell'utente
   (a mano, con il codice a barre o da una fotografia). */
const CATS = ["Pane e cereali","Primi e patate","Frutta","Verdura e legumi","Latte e derivati","Dolci e snack","Fuori casa","Bevande","Zuccheri rapidi","Altro"];
function calcolaBolo(cho, grassi, proteine, igPrevalente) {
  const kcalGP = grassi * 9 + proteine * 4;
  const ugp = kcalGP / 100;

  let tipo, split, durata, spiega;

  if (cho < 5 && ugp < 1) {
    tipo = "Nessun bolo per i carboidrati";
    split = null; durata = null;
    spiega = "Il pasto contiene pochissimi carboidrati e pochi grassi.";
  } else if (ugp < 1) {
    tipo = "Bolo immediato";
    split = null; durata = null;
    spiega = "Pasto magro: l'assorbimento è rapido e si concentra nella prima ora.";
  } else if (ugp < 2) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "3 ore";
    spiega = "Grassi e proteine rallentano lo svuotamento gastrico: una coda di insulina copre la seconda fase.";
  } else if (ugp < 3) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "4 ore";
    spiega = "Quantità importante di grassi e proteine: il rialzo tardivo è la parte più difficile da coprire.";
  } else if (ugp < 4) {
    tipo = "Onda doppia";
    split = [50, 50]; durata = "5 ore";
    spiega = "Pasto ricco e lento. Metà insulina subito, metà distribuita sulle ore successive.";
  } else {
    tipo = "Onda doppia lunga";
    split = [50, 50]; durata = "6-8 ore";
    spiega = "Pasto molto grasso e abbondante: l'effetto sulla glicemia può durare tutta la sera e la notte.";
  }

  // Pochi carboidrati ma molti grassi/proteine: la quota immediata serve poco.
  if (cho < 15 && ugp >= 2) {
    tipo = "Onda quadra";
    split = null; durata = "4-6 ore";
    spiega = "Quasi nessun carboidrato rapido, ma un grande carico di grassi e proteine che alza la glicemia in ritardo.";
  }

  let prebolo;
  if (tipo === "Nessun bolo per i carboidrati") prebolo = null;
  else if (ugp >= 2) prebolo = "0-10 minuti prima";
  else if (igPrevalente === "alto") prebolo = "15-20 minuti prima";
  else if (igPrevalente === "medio") prebolo = "10-15 minuti prima";
  else prebolo = "0-10 minuti prima";

  return { ugp, tipo, split, durata, prebolo, spiega };
}

/* ---------------------------------------------------------------
   LOGICA SPORT
   Fasce orientative di carboidrati aggiuntivi e forma del profilo
   basale (riduzione percentuale e anticipo, mai unità) per attività
   aerobiche, in base a intensità, durata e fascia oraria.
   --------------------------------------------------------------- */
/* Ogni sport ha UNA sola condizione da scegliere: la durata (nuoto,
   trekking) o la distanza in km (corsa). Per ogni valore c'è una riga
   di parametri compilabile (CHO prima e durante); i valori di partenza
   sotto ("base": [prima, durante]) sono indicativi. */
/* "base" per ogni durata/distanza: [CHO prima (g), anticipo in minuti
   con cui applicare il profilo basale "Esercizio" del microinfusore
   rispetto alla partenza]. Tutto modificabile dai parametri. */
const ATTIVITA = {
  nuoto:    { nome:'Nuoto',    icona:'🏊', sotto:'Aerobica in acqua',        cond:'Durata',
    opzioni:[[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h']],
    base:{ 30:[10,60], 60:[18,60], 90:[20,75], 120:[25,90] } },
  corsa:    { nome:'Corsa',    icona:'🏃', sotto:'Aerobica ad alto consumo', cond:'Distanza',
    opzioni:[[5,'5 km'],[10,'10 km'],[15,'15 km'],[21,'21 km']],
    base:{ 5:[15,60], 10:[22,60], 15:[26,75], 21:[30,90] } },
  trekking: { nome:'Trekking', icona:'🥾', sotto:'Camminata lunga',          cond:'Durata',
    opzioni:[[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h']],
    base:{ 30:[8,60], 60:[14,60], 90:[16,75], 120:[20,90] } }
};

function tabellaDefault(id){
  const att = ATTIVITA[id] || ATTIVITA.nuoto;
  const t = { voci:{} };
  for(const [v] of att.opzioni){
    const b = att.base[v] || [0, 60];
    t.voci[v] = { prima:b[0], anticipo:b[1] };
  }
  return t;
}
function tabellaSport(id){
  const salvata = (leggi().tabelleSport || {})[id] || {};
  const t = tabellaDefault(id);
  for(const riga in t.voci)
    for(const col in t.voci[riga]){
      const v = salvata.voci && salvata.voci[riga] ? salvata.voci[riga][col] : undefined;
      if(typeof v === 'number' && isFinite(v) && v >= 0) t.voci[riga][col] = v;
    }
  return t;
}
function salvaCella(id, sez, riga, col, val){
  const tutte = leggi().tabelleSport || {};
  const t = tutte[id] || (tutte[id] = {});
  const s = t[sez] || (t[sez] = {});
  const r = s[riga] || (s[riga] = {});
  const n = parseFloat(String(val).replace(',', '.'));
  if(isFinite(n) && n >= 0) r[col] = Math.round(n); else delete r[col];
  scrivi({ tabelleSport: tutte });
}

/* Regole glicemiche, comuni a tutti gli sport e modificabili dai
   parametri: grammi di correzione per fascia di glicemia prima, e —
   sopra la soglia scelta dall'utente — niente carboidrati ma un bolo
   correttivo: (glicemia − obiettivo) ÷ FSI, al mezzo di unità. L'FSI
   non ha un valore di partenza: finché non lo imposta l'utente, per le
   glicemie alte si segnala solo di impostarlo. */
function glicParam(){
  const p = leggi().glicemiaSport || {};
  const n = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  return {
    b70: n(p.b70, 15), b90: n(p.b90, 10), b180: n(p.b180, 0), bAlta: n(p.bAlta, -5),
    soglia: Math.max(181, n(p.soglia, 250)),
    fsi: (typeof p.fsi === 'number' && isFinite(p.fsi) && p.fsi > 0) ? p.fsi : null,
    obiettivo: n(p.obiettivo, 150)
  };
}
function salvaGlicParam(campo, val){
  const p = leggi().glicemiaSport || {};
  const n = parseFloat(String(val).replace(',', '.'));
  if(isFinite(n)) p[campo] = n; else delete p[campo];
  scrivi({ glicemiaSport: p });
}

function calcolaSport({ attivita, cond, glic }) {
  const g = parseFloat(String(glic ?? '').replace(',', '.'));
  const glicOk = isFinite(g) && g >= 20 && g <= 600;

  /* Profilo basale "Esercizio": l'app dice solo quale profilo usare e
     con quanti minuti di anticipo applicarlo, dalla riga scelta. */
  const v = cond != null ? (tabellaSport(attivita).voci[cond] || { prima:0, anticipo:60 }) : null;
  const basale = v ? { anticipo: v.anticipo } : null;

  /* Nessuna proposta CHO finché mancano la condizione o la glicemia. */
  if(cond == null || !glicOk) return { pronto:false, basale, prima:0, correzione:0 };

  const P = glicParam();
  if(g > P.soglia){
    const unita = P.fsi ? Math.max(0, Math.round((g - P.obiettivo) / P.fsi * 2) / 2) : null;
    return { pronto:true, bolo:{ unita }, basale, prima:0, correzione:0 };
  }
  const correzione = g < 70 ? P.b70 : g < 90 ? P.b90 : g <= 180 ? P.b180 : P.bAlta;
  const prima = Math.max(0, Math.round(v.prima + correzione));
  return { pronto:true, basale, prima, correzione };
}

/* Il riquadro della proposta: grammi di CHO, oppure il bolo per le
   glicemie alte, oppure il segnaposto finché mancano i dati. */
function boxPrima(r, att){
  const base = 'margin:0;padding:14px 16px;';
  if(!r.pronto) return `<div class="box" id="r-box" style="${base}background:var(--card);border:1px dashed var(--line);box-shadow:none">

  if(r.bolo) return `<div class="box" id="r-box" style="${base}background:var(--hypo);color:#fff;box-shadow:0 4px 14px rgba(176,36,24,.3)">
    ${r.bolo.unita == null
      ? `<div style="font-weight:800;font-size:17px;line-height:1.2">Glicemia alta</div>
         <div style="font-size:12px;opacity:.9;margin-top:5px">imposta FSI e obiettivo nei parametri per avere il bolo</div>`
      : `<div class="num" style="font-size:38px;font-weight:800;line-height:1">${String(r.bolo.unita).replace('.', ',')}<span style="font-size:17px;font-weight:700"> U</span></div>

  return `<div class="box eroeViola" id="r-box" style="${base}">

      r.correzione ? ` · ${r.correzione > 0 ? '+' : ''}${r.correzione} g glicemia` : ''}</div></div>`;
}

/* ---------- autoallineamento sport ----------
   Ogni attività può essere registrata: condizioni, CHO davvero presi e,
   quando la si misura, la glicemia dopo l'attività. Dall'esito i
   parametri si aggiustano da soli, a piccoli passi: sotto 70 mg/dl i
   carboidrati erano pochi, tra 70 e 180 la quantità presa era giusta,
   sopra 180 erano troppi. La cella "prima" delle condizioni usate si
   sposta a metà strada verso la quantità che avrebbe funzionato. */
function sessioniSport(){ const v = leggi().sessioniSport; return Array.isArray(v) ? v : []; }
function salvaSessioni(arr){ scrivi({ sessioniSport: arr.slice(-50) }); }
const etichettaDi = (lista, v) => (lista.find(x => String(x[0]) === String(v)) || ['', String(v)])[1];
function valutaEsito(g){ return g < 70 ? 'bassa' : g > 180 ? 'alta' : 'range'; }
function autoallinea(s, glicDopo){
  const esito = valutaEsito(glicDopo);
  const delta = esito === 'bassa' ? 5 : esito === 'alta' ? -5 : 0;
  const att = ATTIVITA[s.attivita];
  /* Le sessioni "bolo" (glicemia alta, niente CHO) non tarano le celle. */
  const cella = att && !s.bolo ? tabellaSport(s.attivita).voci[s.cond] : null;
  let nota;
  if(cella){
    const vecchia = cella.prima;
    /* La taratura ragiona al netto della correzione glicemica del giorno. */
    const target = Math.max(0, Math.round(s.presiPrima + delta - (s.correzione || 0)));
    const nuova = Math.max(0, Math.round((vecchia + target) / 2));
    if(nuova !== vecchia) salvaCella(s.attivita, 'voci', s.cond, 'prima', nuova);
    const dove = `${att.nome} · ${etichettaDi(att.opzioni, s.cond)}`;
    nota = esito === 'range'
      ? (nuova !== vecchia ? `in range: CHO "prima" (${dove}) allineati da ${vecchia} a ${nuova} g.`
                           : `in range: parametri confermati (${dove}).`)
      : esito === 'bassa'
        ? `bassa: i carboidrati erano pochi. CHO "prima" (${dove}): ${vecchia} → ${nuova} g.`
        : `alta: i carboidrati erano troppi. CHO "prima" (${dove}): ${vecchia} → ${nuova} g.`;
  } else {
    /* Sessione registrata con una versione precedente: solo l'esito. */
    nota = esito === 'range' ? 'in range.' : esito === 'bassa'
      ? 'bassa: i carboidrati erano pochi.' : 'alta: i carboidrati erano troppi.';
  }
  return { esito, nota };
}

/* Promemoria: la sessione più recente senza esito, registrata da
   almeno un'ora, viene riproposta in Home e in Sport per inserire la
   glicemia dopo l'attività. */
/* La registrazione avviene alla partenza dell'attività, quindi il
   promemoria scade alla durata più mezz'ora da quel momento. Per la
   corsa la durata si stima dalla distanza (~6 minuti al chilometro). */
function scadenzaEsito(x){
  const a = ATTIVITA[x.attivita];
  const minuti = a && a.cond === 'Distanza' ? (x.cond || 10) * 6 : (x.cond || 60);
  return x.quando + (minuti + 30) * 60000;
}
function promemoriaEsito(){
  const p = sessioniSport().filter(x => x.glicDopo == null && Date.now() >= scadenzaEsito(x)).pop();
  if(!p) return '';
  const a = ATTIVITA[p.attivita] || {};
  return `<button class="card" style="width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;
    margin-bottom:12px;border:1px solid var(--sport);background:var(--sport-soft);text-align:left"
    data-a="esitoSport:${p.id}">
    <span style="font-size:22px;line-height:1">${a.icona||'🏃'}</span>
    <span style="flex:1;font-size:13px;line-height:1.35"><b>Com'è andata${a.nome ? ' con ' + a.nome.toLowerCase() : ''}?</b><br>
      <span style="color:var(--ink2)">Inserisci la glicemia dopo l'attività: serve a tarare i parametri.</span></span>
    <span style="color:var(--sport);font-weight:700;font-size:18px">›</span></button>`;
}

/* ---------- anagrafica piatti ----------
   Un piatto è una combinazione già porzionata di alimenti
   dell'anagrafica: ogni ingrediente ha una quantità di default a peso
   (es. pasta 90 g) o a pezzi (es. 2 pasticcini da 35 g). I CHO del
   piatto vengono calcolati dal database degli alimenti. */
function sanificaPiatto(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if(typeof o.n !== 'string' || !o.n.trim()) return null;
  const ing = (Array.isArray(o.ing) ? o.ing : []).map(i => {
    if(!i || typeof i !== 'object' || typeof i.alimento !== 'string') return null;
    if(i.modo === 'pezzi'){
      const pz = Math.round(+i.pezzi), gp = Math.round(+i.gPezzo*10)/10;
      return pz > 0 && gp > 0 ? { alimento:i.alimento, modo:'pezzi', pezzi:pz, gPezzo:gp } : null;
    }
    const g = Math.round(+i.g*10)/10;
    return g > 0 ? { alimento:i.alimento, modo:'g', g } : null;
  }).filter(Boolean);
  if(!ing.length) return null;
  return {
    id: typeof o.id === 'string' && o.id ? o.id : nuovoId(),
    n: o.n.trim(),
    e: typeof o.e === 'string' && o.e.trim() ? Array.from(o.e.trim()).slice(0,3).join('') : '🍽️',
    foto: typeof o.foto === 'string' && o.foto.startsWith('data:image') ? o.foto : null,
    ing,
    ...(typeof o.daRicetta === 'string' && o.daRicetta ? { daRicetta: o.daRicetta } : {}),
    ...(Number.isInteger(o.mancanti) && o.mancanti > 0 ? { mancanti: o.mancanti } : {})
  };
}

/* ---------- ricette che diventano piatti ----------
   Ogni ricetta genera (e tiene aggiornato) un piatto in anagrafica:
   le voci in grammi vengono abbinate per nome agli alimenti, così i
   carboidrati arrivano dal database; le voci non abbinabili vengono
   contate come "mancanti" e segnalate nel piatto. */
function sincronizzaPiattoRicetta(r){
  const ing = [];
  let mancanti = 0;
  for(const sez of r.sezioni) for(const v of sez.voci){
    const u = v.u || 'g';
    if(u === 'qb') continue;             /* q.b.: irrilevante per i CHO */
    const g = parseFloat(String(v.q).replace(',', '.'));
    if(u !== 'g' || !(g > 0)){ mancanti++; continue; }
    const c = FOODS.find(f => norm(f.n) === norm(v.n))
      || FOODS.find(f => norm(v.n).includes(norm(f.n)) || norm(f.n).includes(norm(v.n)));
    if(c) ing.push({ alimento: c.id, modo:'g', g: Math.round(g*10)/10 });
    else mancanti++;
  }
  const i = PIATTI.findIndex(pl => pl.daRicetta === r.id);
  if(!ing.length){
    if(i >= 0){ PIATTI.splice(i, 1); scrivi({ piatti: PIATTI }); }
    return;
  }
  const dati = sanificaPiatto({ id: i >= 0 ? PIATTI[i].id : undefined,
    n: r.n, foto: r.foto, ing, daRicetta: r.id, mancanti });
  if(!dati) return;
  if(i >= 0) PIATTI[i] = dati; else PIATTI.push(dati);
  scrivi({ piatti: PIATTI });
}

let PIATTI = (leggi().piatti || []).map(sanificaPiatto).filter(Boolean);

/* ---------- ricettario ----------
   Ricette personali strutturate come un vero ricettario: sezioni di
   ingredienti con titolo (es. "Per la besciamella") e voci
   nome + quantità, più il procedimento a passaggi numerati. Campi
   aggiungibili, modificabili ed eliminabili dal modulo. Indipendenti
   dal conteggio dei carboidrati. */
function sanificaRicetta(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if(typeof o.n !== 'string' || !o.n.trim()) return null;
  let sezioni = Array.isArray(o.sezioni) ? o.sezioni.map(s => ({
    titolo: s && typeof s.titolo === 'string' ? s.titolo.trim() : '',
    voci: s && Array.isArray(s.voci) ? s.voci.map(v => {
      if(!v) return null;
      let q = typeof v.q === 'string' ? v.q.trim() : '';
      let u = ['g','qb','cm','cc','n'].includes(v.u) ? v.u : null;
      /* Migrazione: 'q.b.' scritto nella quantità diventa l'unità q.b. */
      if(!u){ if(/^q\.? ?b\.?$/i.test(q)){ u = 'qb'; q = ''; } else u = 'g'; }
      return { n: typeof v.n === 'string' ? v.n.trim() : '', q, u };
    }).filter(v => v && v.n) : []
  })).filter(s => s.voci.length || s.titolo) : null;
  /* Ogni passaggio può avere una foto; i vecchi passi a stringa migrano. */
  const fotoOk = f => typeof f === 'string' && (f.startsWith('data:image') || f.startsWith('https://')) ? f : null;
  const listaPassi = arr => Array.isArray(arr)
    ? arr.map(x => {
        if(typeof x === 'string') return { t: x.trim(), foto: null };
        if(x && typeof x === 'object') return { t: typeof x.t === 'string' ? x.t.trim() : '', foto: fotoOk(x.foto) };
        return null;
      }).filter(x => x && (x.t || x.foto)) : null;
  /* La preparazione è ad albero come gli ingredienti: sezioni con
     titolo e passi. Il vecchio elenco piatto migra in un'unica
     sezione senza titolo. */
  let passi = null;
  if(Array.isArray(o.passi)){
    const aSezioni = o.passi.length && o.passi.every(x => x && typeof x === 'object' && Array.isArray(x.passi));
    if(aSezioni){
      passi = o.passi.map(sz => ({
        titolo: typeof sz.titolo === 'string' ? sz.titolo.trim() : '',
        passi: listaPassi(sz.passi) || []
      })).filter(sz => sz.passi.length || sz.titolo);
    } else {
      const piatti = listaPassi(o.passi) || [];
      passi = piatti.length ? [{ titolo:'', passi: piatti }] : [];
    }
  }
  const cottura = listaPassi(o.cottura) || [];
  /* Migrazione dal vecchio formato a testo libero. */
  if(!sezioni && typeof o.ing === 'string' && o.ing.trim())
    sezioni = [{ titolo:'', voci: o.ing.split('\n').map(x => x.trim()).filter(Boolean).map(n => ({ n, q:'' })) }];
  if(!passi && typeof o.proc === 'string' && o.proc.trim())

/* Nelle quantità i grammi sono l'unità di default: un numero secco

const UNITA_RICETTA = ['g','qb','cm','cc','n'];
/* Etichetta compatta dell'unità: testo per g/q.b./n°, iconcina a
   cucchiaio (da minestra) o cucchiaino (da caffè) per le altre. */
function etichettaUnita(u){
  if(u === 'cm') return `<span style="display:inline-flex;vertical-align:-4px" title="cucchiaio da minestra">${ico('cucchiaio',17)}</span>`;
  if(u === 'cc') return `<span style="display:inline-flex;vertical-align:-3px" title="cucchiaino da caffè">${ico('cucchiaino',14)}</span>`;
  return u === 'qb' ? 'q.b.' : u === 'n' ? 'n°' : 'g';
}
function qtaVoceHTML(v){
  const q = esc(String(v.q || '').trim());
  const u = v.u || 'g';
  if(u === 'qb') return 'q.b.';
  if(!q) return '';
  if(u === 'g') return /^\d+([.,]\d+)?$/.test(q) ? q + ' g' : q;
  if(u === 'cm' || u === 'cc') return `${q} ${etichettaUnita(u)}`;
  if(u === 'n') return 'n° ' + q;
  return q;
}

  }
  scrivi({ fotoVerdureLasagne: true });
}
/* Besciamella rapportata a un litro di latte e passo del forno spostato
   nella nuova parte Cottura, anche per la copia già salvata. */
if(!leggi().lasagneLitroCottura){
  const r = RICETTE.find(x => x.n === 'Lasagne vegetariane');
  if(r){
    let cambiata = false;
    const bes = r.sezioni.find(sz => /besciamella/i.test(sz.titolo));
    if(bes){
      const latte = bes.voci.find(v => /latte/i.test(v.n));
      if(latte && latte.q === '600'){
        latte.q = '1000'; cambiata = true;
        const farina = bes.voci.find(v => /farina/i.test(v.n));
        if(farina && farina.q === '50') farina.q = '85';
        const burro = bes.voci.find(v => /burro/i.test(v.n));
        if(burro && burro.q === '50') burro.q = '85';
      }
    }
    if(!r.cottura.length && r.passi.length && /forno statico/i.test(r.passi[r.passi.length - 1].t)){
      r.cottura = [r.passi.pop()]; cambiata = true;
    }
    if(cambiata) scrivi({ ricette: RICETTE });
  }
  scrivi({ lasagneLitroCottura: true });
}
/* La preparazione delle Lasagne diventa ad albero: prima le verdure,
   poi la besciamella, poi l'assemblaggio (per la copia già salvata). */
if(!leggi().lasagnePrepAlbero){
  const r = RICETTE.find(x => x.n === 'Lasagne vegetariane');
  if(r && r.passi.length === 1 && !r.passi[0].titolo){
    const p = r.passi[0].passi;
    const bes = p.filter(x => /besciamella/i.test(x.t) && !/Componi|strati/i.test(x.t));
    const verd = p.filter(x => /bastoncini|rosola|saltare/i.test(x.t));
    const resto = p.filter(x => !bes.includes(x) && !verd.includes(x));
    if(bes.length && verd.length){
      r.passi = [
        { titolo: 'Per il sugo di verdure', passi: verd },
        { titolo: 'Per la besciamella', passi: bes },
        ...(resto.length ? [{ titolo: 'Assemblaggio', passi: resto }] : [])
      ];
      scrivi({ ricette: RICETTE });
    }
  }
  scrivi({ lasagnePrepAlbero: true });
}

/* ---------- registro del peso ---------- */
function sanificaPeso(o){
  if(!o || typeof o !== 'object') return null;
  const t = typeof o.t === 'string' ? new Date(o.t) : null;
  const kg = Math.round(+o.kg*10)/10;
  if(!t || isNaN(t) || !(kg >= 20 && kg <= 300)) return null;
  return { t: o.t, kg };
}
let PESO = (leggi().peso || []).map(sanificaPeso).filter(Boolean)
  .sort((a,b) => new Date(a.t) - new Date(b.t));

const grIng = i => i.modo === 'pezzi' ? i.pezzi * i.gPezzo : i.g;
function totaliPiatto(ing){
  let cho = 0, f = 0, p = 0;
  for(const i of ing){
    const c = cibo(i.alimento); if(!c) continue;
    const g = grIng(i);
    cho += c.cho*g/100; f += c.f*g/100; p += c.p*g/100;
  }
  return { cho, f, p };
}

async function ridimensionaFoto(sorgente){
  const img = await createImageBitmap(sorgente);
  const sc = Math.min(1, 480 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', .72);
}

/* ---------- esportazione in PDF ----------
   PDF generato a mano (nessuna libreria): font base Helvetica con
   codifica WinAnsi, quindi solo testo latino — le emoji vengono
   omesse. Una tabella per pagina A4, multi-pagina se serve. */
function pdfTesto(t){
  return String(t).normalize('NFC').split('')
    .filter(c => c.charCodeAt(0) >= 32 && c.charCodeAt(0) <= 255).join('')
    .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').trim();
}

function costruisciPdf(pagine){
  const oggetti = [];
  const idPagine = pagine.map((_, k) => 5 + 2*k);
  oggetti[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  oggetti[2] = `<< /Type /Pages /Kids [${idPagine.map(id => id + ' 0 R').join(' ')}] /Count ${pagine.length} >>`;
  oggetti[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  oggetti[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pagine.forEach((cont, k) => {
    oggetti[5 + 2*k] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + 2*k} 0 R >>`;
    oggetti[6 + 2*k] = { stream: cont };
  });
  let pdf = '%PDF-1.4\n';
  const offset = [];
  for(let i = 1; i < oggetti.length; i++){
    offset[i] = pdf.length;
    const o = oggetti[i];
    pdf += typeof o === 'string'
      ? `${i} 0 obj\n${o}\nendobj\n`
      : `${i} 0 obj\n<< /Length ${o.stream.length} >>\nstream\n${o.stream}endstream\nendobj\n`;
  }
  const xref = pdf.length;
  pdf += `xref\n0 ${oggetti.length}\n0000000000 65535 f \n`;
  for(let i = 1; i < oggetti.length; i++) pdf += String(offset[i]).padStart(10,'0') + ' 00000 n \n';
  pdf += `trailer\n<< /Size ${oggetti.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return Uint8Array.from(pdf, c => c.charCodeAt(0) & 0xFF);
}

function esportaDati(){
  if(!FOODS.length){ alert('Non ci sono ancora alimenti da esportare.'); return; }
  const dataIt = new Date().toLocaleDateString('it-IT');
  const ordinati = [...FOODS].sort((a,b) => a.n.localeCompare(b.n, 'it'));
  const col = [40, 330, 392, 452, 515];
  const perPagina = 38;
  const nPagine = Math.ceil(ordinati.length / perPagina);
  const pagine = [];
  for(let i = 0; i < nPagine; i++){
    let s = '';
    const T = (x, y, f, dim, testo) => { s += `BT /${f} ${dim} Tf ${x} ${y} Td (${pdfTesto(testo)}) Tj ET\n`; };
    let y = 782;
    if(i === 0){
      T(40, y, 'F2', 20, 'CHO - I miei alimenti'); y -= 18;
      T(40, y, 'F1', 10, `Esportato il ${dataIt} - ${ordinati.length} alimenti - valori per 100 g`); y -= 28;
    }
    T(col[0], y, 'F2', 10, 'Alimento'); T(col[1], y, 'F2', 10, 'CHO');
    T(col[2], y, 'F2', 10, 'Grassi'); T(col[3], y, 'F2', 10, 'Proteine');
    T(col[4], y, 'F2', 10, 'Porzione'); y -= 7;
    s += `0.6 w 40 ${y} m 555 ${y} l S\n`; y -= 15;
    for(const f of ordinati.slice(i*perPagina, (i+1)*perPagina)){
      T(col[0], y, 'F1', 10, f.n.slice(0, 46) + (f.alcol ? ' (alcol)' : ''));
      T(col[1], y, 'F1', 10, `${gr1(f.cho)} g`);
      T(col[2], y, 'F1', 10, `${gr1(f.f)} g`);
      T(col[3], y, 'F1', 10, `${gr1(f.p)} g`);
      T(col[4], y, 'F1', 10, f.porz[0][1] !== 100 ? `${gr1(f.porz[0][1])} g` : '-');
      y -= 17;
    }
    T(40, 34, 'F1', 8, `CHO - versione ${VERSIONE} - pagina ${i+1} di ${nPagine} - valori indicativi, verifica le etichette`);
    pagine.push(s);
  }
  const blob = new Blob([costruisciPdf(pagine)], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `atlante-cho-alimenti-${new Date().toISOString().slice(0,10)}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- aggiunta alimenti: scanner, foto, Open Food Facts ----------
   La lettura del codice a barre usa l'API BarcodeDetector dove c'è
   (Chrome/Android); altrove carica al volo la libreria ZXing, così la
   fotocamera funziona anche su iPhone/Safari. */
const FORMATI_BARCODE = ['ean_13','ean_8','upc_a','upc_e','code_128'];
let flussoCamera = null, cicloScan = null, rilevatore = null, zxReader = null, zxPromise = null;

function formVuoto(){
  return { n:'', e:'', cho:'', f:'', p:'', ig:'medio', alcol:'no', cat:'Altro', porz:'', foto:null };
}

const EMOJI_CIBO = ['🍞','🥐','🥖','🍝','🍚','🥔','🍕','🥪','🍔','🍎','🍌','🍊','🍇','🍓','🍑','🥝','🥦','🥕','🍅','🫘','🥛','🧀','🥣','🥚','🍖','🐟','🍪','🍫','🍰','🍨','🍯','🍬','🥤','🧃','🍺','🍷'];

const scannerAttivo = () => !!(flussoCamera || zxReader);

function caricaZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxPromise) return zxPromise;
  zxPromise = new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = () => window.ZXing ? ok() : ko(new Error('zxing'));
    s.onerror = () => { zxPromise = null; ko(new Error('rete')); };
    document.head.appendChild(s);
  });
  return zxPromise;
}

function msgErroreCamera(e){
  if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
    return "Il permesso per la fotocamera è stato negato. Riattivalo nelle impostazioni del browser per questo sito " +
      "(Android: menu ⋮ → Impostazioni sito → Fotocamera; iPhone: Impostazioni → Safari/app → Fotocamera), poi riprova. " +
      "In alternativa digita il codice qui sotto.";
  if(e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError'))
    return "Non trovo una fotocamera su questo dispositivo: digita il codice qui sotto o usa una foto del codice.";
  if(e && e.message === 'rete')
    return "Non riesco a scaricare il modulo di lettura (serve internet): digita il codice qui sotto.";
  return "Non riesco ad avviare la fotocamera: digita il codice qui sotto oppure usa una foto del codice.";
}

async function avviaScanner(){
  S.msgScanner = "Sto avviando la fotocamera…"; disegna();
  if(!window.isSecureContext){
    S.msgScanner = "La fotocamera funziona solo aprendo l'app da un indirizzo https: digita il codice qui sotto.";
    disegna(); return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    S.msgScanner = "Questo browser non dà accesso alla fotocamera: digita il codice qui sotto o usa una foto del codice.";
    disegna(); return;
  }
  try{
    if('BarcodeDetector' in window){
      rilevatore = rilevatore || new BarcodeDetector({ formats: FORMATI_BARCODE });
      flussoCamera = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      if(S.nuovo !== 'barcode'){ fermaScanner(); return; }
      S.msgScanner = ''; disegna();
      cicloScan = setInterval(async () => {
        const v = document.getElementById('anteprima');
        if(!v || !v.videoWidth || S.caricamento) return;
        try{
          const codici = await rilevatore.detect(v);
          if(codici.length){
            fermaScanner();
            S.codice = codici[0].rawValue;
            cercaCodice(S.codice);
          }
        }catch(e){}
      }, 350);
    } else {
      await caricaZXing();
      if(S.nuovo !== 'barcode') return;
      zxReader = new ZXing.BrowserMultiFormatReader();
      S.msgScanner = ''; disegna();
      const aColpo = (ris) => {
        if(!ris || S.caricamento) return;
        const c = ris.getText();
        fermaScanner();
        S.codice = c;
        cercaCodice(c);
      };
      if(zxReader.decodeFromConstraints)
        await zxReader.decodeFromConstraints({ video:{ facingMode:'environment' } }, 'anteprima', aColpo);
      else
        await zxReader.decodeFromVideoDevice(undefined, 'anteprima', aColpo);
    }
  }catch(e){
    fermaScanner();
    S.msgScanner = msgErroreCamera(e);
    disegna();
  }
}

function fermaScanner(){
  if(cicloScan){ clearInterval(cicloScan); cicloScan = null; }
  if(flussoCamera){ flussoCamera.getTracks().forEach(t => t.stop()); flussoCamera = null; }
  if(zxReader){ try{ zxReader.reset(); }catch(e){} zxReader = null; }
}

function fotoBarcode(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    let codice = null;
    try{
      if('BarcodeDetector' in window){
        const img = await createImageBitmap(file);
        rilevatore = rilevatore || new BarcodeDetector({ formats: FORMATI_BARCODE });
        const codici = await rilevatore.detect(img);
        if(codici.length) codice = codici[0].rawValue;
      } else {
        await caricaZXing();
        const url = URL.createObjectURL(file);
        try{
          const ris = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);
          codice = ris.getText();
        }catch(e){ /* nessun codice leggibile */ }
        finally{ URL.revokeObjectURL(url); }
      }
    }catch(e){
      alert(e && e.message === 'rete'
        ? "Per leggere la foto serve internet la prima volta: controlla la connessione e riprova, oppure digita il codice."
        : "Non riesco a leggere questa immagine.");
      return;
    }
    if(!codice){
      alert("Nella foto non si legge nessun codice a barre. Riprova con una foto nitida e ravvicinata del codice, oppure digitalo.");
      S.nuovo = 'barcode'; S.msgScanner = ''; disegna(); return;
    }
    fermaScanner();
    S.nuovo = 'barcode'; S.codice = codice; S.msgScanner = ''; disegna();
    cercaCodice(codice);
  };
  inp.click();
}

async function cercaCodice(codice){
  codice = String(codice || '').trim();
  if(!/^\d{6,14}$/.test(codice)){ alert("Inserisci un codice a barre valido (solo cifre)."); return; }
  S.nuovo = 'barcode'; S.caricamento = true; disegna();
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codice}.json?fields=product_name,product_name_it,nutriments,image_front_small_url,image_front_url`);
    const j = await r.json();
    S.caricamento = false;
    if(!j.product || !j.status){
      alert("Prodotto non trovato su Open Food Facts. Puoi inserirlo a mano.");
      disegna(); return;
    }
    const nu = j.product.nutriments || {};
    const num = x => (typeof x === 'number' && isFinite(x) && x >= 0) ? String(Math.round(x*10)/10) : '';
    fermaScanner();
    S.form = { ...formVuoto(),
      n: j.product.product_name_it || j.product.product_name || '',
      cho: num(nu.carbohydrates_100g), f: num(nu.fat_100g), p: num(nu.proteins_100g),
      alcol: (+nu.alcohol_100g || 0) > 0 ? 'si' : 'no'
    };
    S.editId = null; S.nuovo = 'form';
    disegna();
    const urlFoto = j.product.image_front_small_url || j.product.image_front_url;
    if(urlFoto) caricaFotoProdotto(urlFoto);
    if(!S.form.cho) alert("Il prodotto è stato trovato ma i carboidrati per 100 g non sono indicati: completali tu dall'etichetta.");
  }catch(e){
    S.caricamento = false;
    alert("Ricerca non riuscita: controlla la connessione a internet e riprova, oppure inserisci l'alimento a mano.");
    disegna();
  }
}

/* La vera foto del prodotto, da Open Food Facts: scaricata e salvata
   rimpicciolita nel modulo aperto, così resta anche senza internet.
   Se il download non riesce si tiene l'indirizzo remoto dell'immagine. */
async function caricaFotoProdotto(url){
  let d = url;
  try{ d = await ridimensionaFoto(await (await fetch(url)).blob()); }catch(e){}
  if(S.form && S.nuovo === 'form' && !S.form.foto){
    S.form.foto = d;
    /* Niente ridisegno mentre si scrive in un campo: la foto comparirà
       al prossimo tocco. */
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag !== 'INPUT' && tag !== 'TEXTAREA') disegna();
  }
}

function salvaAlimento(){
  const F = S.form; if(!F) return;
  const dec = v => parseFloat(String(v).replace(',','.'));
  const nome = F.n.trim();
  const cho = dec(F.cho);
  if(!nome){ alert("Dai un nome all'alimento."); return; }
  if(!(cho >= 0 && cho <= 100)){ alert("Indica i carboidrati per 100 g: un numero da 0 a 100."); return; }
  const num = v => { const x = dec(v); return x >= 0 && x <= 100 ? Math.round(x*10)/10 : 0; };
  const porzG = Math.round(dec(F.porz)*10)/10;
  const dati = sanificaAlimento({
    id: S.editId || undefined,
    n: nome, e: F.e, cat: F.cat, foto: F.foto,
    cho: Math.round(cho*10)/10, f: num(F.f), p: num(F.p),
    ig: F.ig, alcol: F.alcol === 'si',
    porz: porzG > 0 ? [["1 porzione", porzG], ["100 g", 100]] : [["100 g", 100]]
  });
  if(S.editId){
    const i = FOODS.findIndex(x => x.id === S.editId);
    if(i >= 0) FOODS[i] = dati; else FOODS.push(dati);
  } else {
    FOODS.push(dati);
  }
  if(!scrivi({ alimenti: FOODS }))
    alert('Spazio sul telefono esaurito: prova a togliere la foto o a usarne una più piccola.');
  S.nuovo = null; S.form = null; S.editId = null;
  disegna();
}

const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
/* pesi con al massimo un decimale, virgola all'italiana */
const gr1 = x => { const v = Math.round(x*10)/10; return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',','); };
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

          ? `${RICETTE.length} ricett${RICETTE.length === 1 ? 'a' : 'e'}`
          : 'Scrivile una volta, le ritrovi sempre qui.'}</div>
      </div>
    </div>`;

  if(!RICETTE.length) return `
    ${hero}
    <div class="card" style="padding:28px 24px;text-align:center">
      <span class="emg" style="margin:0 auto;background:var(--wave-soft);color:var(--wave)">${ico('pentola',27)}</span>

  const celle = lista.map((r,i) => {
    const nIng = r.sezioni.reduce((t,s) => t + s.voci.length, 0);
    return `
    <div class="cella" style="animation-delay:${Math.min(i,8)*45}ms">
      <button class="apri" data-a="ricApri:${r.id}">
        ${r.foto
          ? `<img src="${r.foto}" alt="" style="width:100%;height:92px;object-fit:cover;border-radius:16px;display:block">`
          : `<span class="emg" style="background:var(--wave-soft);color:var(--wave)">${ico('pentola',27)}</span>`}

        <span style="font-size:11px;color:var(--ink2)">${nIng ? `${nIng} ingredient${nIng === 1 ? 'e' : 'i'}` : 'da completare'}</span>
      </button>

  return `
    ${hero}
    <div class="cerca">${ico('cerca',20)}
      <input id="qr" placeholder="Cerca una ricetta" value="${esc(S.qr)}">
    </div>
    ${celle ? `<div class="griglia">${celle}</div>`
      : `<div style="text-align:center;padding:48px 0;color:var(--ink2)">Nessuna ricetta con questo nome.</div>`}`;
}

/* ---------- strato: lettura di una ricetta (stile ricettario) ---------- */
function stratoRicetta(){
  const r = RICETTE.find(x => x.id === S.ricettaAperta); if(!r) return '';
  /* Fisarmonica a due livelli: le parti (Ingredienti, Preparazione,
     Cottura) partono compresse; sotto Ingredienti ogni sezione è a sua
     volta espandibile. */
  const esp = S.ricettaEspansi || {};
  const parte = (chiave, titolo, contenuto) => `
    <button style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:13px 0;border-bottom:1px solid var(--line);text-align:left" data-a="ricEsp:${chiave}">
      <span style="font-weight:800;font-size:19px;letter-spacing:-.2px">${titolo}
        <span style="display:block;width:34px;height:3px;background:var(--wave);border-radius:2px;margin-top:4px"></span></span>
      <span style="color:var(--wave)">${ico(esp[chiave] ? 'su' : 'giu', 19)}</span>
    </button>
    ${esp[chiave] ? `<div style="padding:4px 0 10px">${contenuto}</div>` : ''}`;

  const righeVoci = voci => voci.map((v,i) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;
      padding:3px 0;font-size:13.5px${i ? ';border-top:1px dashed var(--line)' : ''}">
      <b>${esc(v.n)}</b><span class="num" style="color:var(--ink2);flex:none">${qtaVoceHTML(v)}</span>
    </div>`).join('');

  const sottoParte = (chiave, titolo, contenuto) => `
    <button style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 0 4px;text-align:left;border-bottom:1px solid var(--line)" data-a="ricEsp:${chiave}">
      <span style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--wave);text-transform:uppercase">${esc(titolo)}</span>
      <span style="color:var(--wave)">${ico(esp[chiave] ? 'su' : 'giu', 15)}</span>
    </button>
    ${esp[chiave] ? `<div style="padding:2px 0 6px">${contenuto}</div>` : ''}`;

  const contenutoIng = r.sezioni.map((s,i) =>
    sottoParte('sez' + i, s.titolo || 'Ingredienti', righeVoci(s.voci))).join('');

  const passiHTML = lista => lista.map((x,k) => `
    <div style="display:flex;gap:11px;margin-top:12px">
      <span style="width:26px;height:26px;border-radius:8px;background:var(--wave);color:#fff;font-weight:700;
        font-size:13px;display:flex;align-items:center;justify-content:center;flex:none">${k+1}</span>
      <div style="flex:1;min-width:0">
        <p style="font-size:14px;margin:2px 0 0">${esc(x.t)}</p>
        ${x.foto ? `<img src="${x.foto}" alt="" style="width:100%;border-radius:14px;display:block;margin-top:8px">` : ''}
      </div>
    </div>`).join('');

  return `
  <div class="velo" data-a="ricChiudi">
    <div class="foglio pieno" data-stop="1">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px">
        <div style="font-weight:800;font-size:22px;line-height:1.2;flex:1;min-width:0">${esc(r.n)}</div>
        <button class="card" style="padding:8px;border-radius:999px;color:var(--wave);flex:none"
          data-a="ricModifica:${r.id}" aria-label="Modifica ricetta">${ico('matita',19)}</button>
        <button class="card" style="padding:8px;border-radius:999px;color:var(--ink2);flex:none" data-a="ricChiudi">${ico('chiudi',20)}</button>
      </div>
      ${r.foto ? `<img src="${r.foto}" alt="" style="width:100%;height:180px;object-fit:cover;border-radius:18px;display:block;margin-bottom:4px">` : ''}
      ${r.sezioni.length ? parte('ing', 'Ingredienti', contenutoIng) : ''}
      ${r.passi.length ? parte('prep', 'Preparazione',
        r.passi.length === 1 && !r.passi[0].titolo
          ? passiHTML(r.passi[0].passi)
          : r.passi.map((sz,i) => sottoParte('psez' + i, sz.titolo || 'Preparazione', passiHTML(sz.passi))).join('')) : ''}
      ${r.cottura.length ? parte('cott', 'Cottura', passiHTML(r.cottura)) : ''}
      ${!r.sezioni.length && !r.passi.length && !r.cottura.length
        ? `<p style="color:var(--ink2);font-size:14px">Ricetta ancora da completare: tocca la matita.</p>` : ''}
    </div>
  </div>`;
}

/* La lista di passaggi indicata dal gruppo: 'c' è la Cottura,
   'p0','p1',… sono le sezioni della Preparazione. */
function gruppoPassi(g){
  if(!S.rform) return null;
  if(g === 'c') return S.rform.cottura;
  const sz = /^p\d+$/.test(String(g)) ? S.rform.passi[+String(g).slice(1)] : null;
  return sz ? sz.passi : null;
}

function salvaRicetta(){
  const F = S.rform; if(!F) return;
  if(!F.n.trim()){ alert('Dai un nome alla ricetta.'); return; }
  const dati = sanificaRicetta({ id: S.editRicettaId || undefined, n:F.n, foto:F.foto, sezioni:F.sezioni, passi:F.passi, cottura:F.cottura });
  if(S.editRicettaId){
    const i = RICETTE.findIndex(x => x.id === S.editRicettaId);
    if(i >= 0) RICETTE[i] = dati; else RICETTE.push(dati);
  } else RICETTE.push(dati);
  if(!scrivi({ ricette: RICETTE }))
    alert('Spazio sul telefono esaurito: prova a togliere la foto o a usarne una più piccola.');
  sincronizzaPiattoRicetta(dati);
  S.rform = null; S.editRicettaId = null;
  disegna();
}
function fotoRicetta(){ scegliFoto(d => { if(S.rform){ S.rform.foto = d; disegna(); } }); }

/* ---------- strato: uso di un piatto ---------- */

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

      <div style="flex:1;min-width:0">

      </div>
      <button class="card" style="width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center" data-a="usoq:${k}:-">${ico('meno',16)}</button>
      <button class="card" style="width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center" data-a="usoq:${k}:+">${ico('piu',16)}</button>
    </div>`;
  }).join('');

  return `
  <div class="velo" data-a="chiudiPiatto">
    <div class="foglio" data-stop="1">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div style="display:flex;gap:12px;align-items:center;min-width:0">
          ${pl.foto
            ? `<img src="${pl.foto}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:16px">`
            : `<span class="emg" style="width:56px;height:56px;background:var(--wave-soft);color:var(--wave)">${ico('cloche',28)}</span>`}
          <div style="min-width:0"><div style="font-weight:700;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pl.n)}</div>
          <div style="font-size:12px;color:var(--ink2)">${ing.length} ingredient${ing.length===1?'e':'i'}</div></div>
        </div>
        <button class="card" style="padding:8px;border-radius:999px;color:var(--ink2)" data-a="chiudiPiatto">${ico('chiudi',20)}</button>
      </div>
      <div style="background:var(--cho-soft);border-radius:24px;padding:18px;text-align:center;margin-bottom:14px">
        <div class="num" style="font-size:50px;font-weight:800;color:var(--cho);line-height:1">${gr1(t.cho)}</div>
        <div style="font-size:14px;font-weight:600;color:var(--cho);margin-top:4px">grammi di carboidrati</div>
        <div style="font-size:12px;color:var(--ink2);margin-top:4px">${gr1(t.f)} g grassi · ${gr1(t.p)} g proteine
          · ${Math.round(t.cho*4 + t.p*4 + t.f*9)} kcal
          · ${b.tipo}${b.split ? ` ${b.split[0]}/${b.split[1]}%` : ''}${b.durata ? ` su ${b.durata}` : ''}</div>

function stratiHTML(){
  return (S.aperto ? stratoPorzione() : '') + stratoNuovo() + stratoPiattoUso() + stratoPiattoForm()
    + (S.ricettaAperta ? stratoRicetta() : '') + stratoRicettaForm()
    + (S.paramSport ? stratoParametri() : '') + (S.sessioneAperta ? stratoSessione() : '')
    + (leggi().avvisoVisto ? '' : stratoAvviso());
}

function salvaPiatto(){
  const F = S.pform; if(!F) return;
  if(!F.n.trim()){ alert('Dai un nome al piatto.'); return; }
  const dati = sanificaPiatto({ id: S.editPiattoId || undefined, n:F.n, e:F.e, foto:F.foto, ing:F.ing,
    daRicetta: F.daRicetta, mancanti: F.mancanti });
  if(!dati){ alert('Aggiungi almeno un ingrediente con una quantità valida.'); return; }
  const nuovi = [...PIATTI];
  if(S.editPiattoId){
    const i = nuovi.findIndex(x => x.id === S.editPiattoId);
    if(i >= 0) nuovi[i] = dati; else nuovi.push(dati);
  } else nuovi.push(dati);
  if(!scrivi({ piatti: nuovi })){
    alert('Spazio sul telefono esaurito: prova a togliere la foto o a usarne una più piccola.');
    return;
  }
  PIATTI = nuovi;
  S.pform = null; S.editPiattoId = null; S.pingQ = '';
  disegna();
}

/* ---------- schermata: peso ---------- */
function graficoPeso(dati){
  const W = 340, H = 200, mL = 36, mR = 16, mT = 16, mB = 26;
  const xs = dati.map(v => new Date(v.t).getTime());
  const ys = dati.map(v => v.kg);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(y1 - y0 < 2){ const c = (y0+y1)/2; y0 = c-1; y1 = c+1; }
  else { const pad = (y1-y0)*.15; y0 -= pad; y1 += pad; }
  const X = t => x1 === x0 ? mL + (W-mL-mR)/2 : mL + (t-x0)/(x1-x0)*(W-mL-mR);
  const Y = v => mT + (y1-v)/(y1-y0)*(H-mT-mB);

  const passo = [0.5,1,2,5,10,20].find(p => (y1-y0)/p <= 5) || 20;
  const ticks = [];
  for(let v = Math.ceil(y0/passo)*passo; v <= y1 + 1e-9; v += passo) ticks.push(Math.round(v*10)/10);
  const dataIt = t => new Date(t).toLocaleDateString('it-IT', {day:'numeric', month:'short'});
  const xTicks = x1 === x0 ? [x0] : (x1-x0 > 45*86400000 ? [x0,(x0+x1)/2,x1] : [x0,x1]);

  const punti = dati.map((v,i) => [X(xs[i]), Y(v.kg)]);
  const linea = punti.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const yBase = Y(y0);
  const area = dati.length > 1
    ? `M${punti[0][0].toFixed(1)} ${yBase} ` + punti.map(p => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')
      + ` L${punti[punti.length-1][0].toFixed(1)} ${yBase} Z` : '';

  let tip = '';
  if(S.pesoTip != null && dati[S.pesoTip]){
    const v = dati[S.pesoTip], p = punti[S.pesoTip];
    const testo = `${gr1(v.kg)} kg · ${dataIt(v.t)}`;
    const larg = testo.length*5.6 + 16;
    let tx = p[0] - larg/2;
    tx = Math.max(4, Math.min(W - larg - 4, tx));
    const ty = p[1] > 52 ? p[1] - 40 : p[1] + 14;
    tip = `
      <rect x="${tx}" y="${ty}" width="${larg}" height="24" rx="8" fill="var(--ink)"/>
      <text x="${tx + larg/2}" y="${ty + 16}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${testo}</text>`;
  }

  const ultimo = dati[dati.length-1];
  const pu = punti[punti.length-1];
  const labUltimo = dati.length > 1
    ? `<text x="${W-mR}" y="${Math.max(mT+9, pu[1]-12).toFixed(1)}" text-anchor="end"
        font-size="11" font-weight="700" fill="var(--ink)" class="num">${gr1(ultimo.kg)}</text>` : '';

  return `
  <svg id="gpeso" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" font-family="inherit">
    ${ticks.map(v => `
      <line x1="${mL}" y1="${Y(v).toFixed(1)}" x2="${W-mR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${mL-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink2)" class="num">${v}</text>`).join('')}
    ${xTicks.map(t => `<text x="${X(t).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink2)">${dataIt(t)}</text>`).join('')}
    ${area ? `<path d="${area}" fill="var(--cho)" opacity=".1"/>` : ''}
    ${dati.length > 1 ? `<path d="${linea}" fill="none" stroke="var(--cho)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${punti.map((p,i) => `
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--cho)" stroke="var(--card)" stroke-width="2"/>
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="14" fill="transparent" style="cursor:pointer" data-a="pesoTip:${i}"/>`).join('')}
    ${labUltimo}
    ${tip}
  </svg>`;
}

function salvaSessione(){
  const s = S.sessioneAperta; if(!s) return;
  const dec = v => parseFloat(String(v).replace(',', '.'));
  const prima = dec(s.presiPrima);
  if(!(prima >= 0)){ alert('Indica i grammi di carboidrati presi (0 se niente).'); return; }
  const glic = String(s.glicDopo ?? '').trim() === '' ? null : dec(s.glicDopo);
  if(glic !== null && !(glic >= 20 && glic <= 600)){ alert('La glicemia dopo non sembra un valore in mg/dl.'); return; }
  const glicPrima = String(s.glicPrima ?? '').trim() === '' ? null : dec(s.glicPrima);
  if(glicPrima !== null && !(glicPrima >= 20 && glicPrima <= 600)){ alert('La glicemia prima non sembra un valore in mg/dl.'); return; }
  const arr = sessioniSport();
  let rec;
  if(s.nuova){
    /* "quando" è l'orario di partenza dell'attività: si registra nel
       momento in cui si parte. */
    rec = { id: nuovoId(), quando: Date.now(), attivita:s.attivita, cond:s.cond,
      suggPrima:s.suggPrima, correzione:s.correzione || 0,
      anticipo:s.anticipo || 0,
      ...(s.bolo ? { bolo:true, boloU:s.boloU } : {}),
      presiPrima:Math.round(prima*10)/10, presiDurante:0,
      glicPrima: glicPrima !== null ? Math.round(glicPrima) : null,
      glicDopo:null, esito:null, nota:null };
    arr.push(rec);
  } else {
    rec = arr.find(v => v.id === s.id);
    if(!rec){ S.sessioneAperta = null; disegna(); return; }
    if(rec.cond == null && s.cond != null) rec.cond = s.cond;
    if(glicPrima !== null) rec.glicPrima = Math.round(glicPrima);
    rec.presiPrima = Math.round(prima*10)/10;
  }
  let msg = null;
  if(glic !== null && rec.glicDopo == null){
    rec.glicDopo = Math.round(glic);
    const r = autoallinea(rec, rec.glicDopo);
    rec.esito = r.esito; rec.nota = r.nota;
    msg = `Glicemia ${rec.glicDopo} mg/dl, ${r.nota}`;
  }
  salvaSessioni(arr);
  S.sessioneAperta = null;
  /* Se resta un esito da inserire, chiedo (una volta) il permesso per
     le notifiche: servirà a ricordare la glicemia a fine attività. */
  if(rec.glicDopo == null && 'Notification' in window && Notification.permission === 'default')
    Notification.requestPermission().catch(() => {});
  disegna();
  if(msg) alert(msg);
}

/* ---------- promemoria attivo ----------
   Ogni minuto (e al ritorno in primo piano) si controlla se una
   sessione ha superato la scadenza: compare il banner e, col permesso,
   parte una notifica di sistema tramite il service worker. */
let swReg = null;
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
  navigator.serviceWorker.register('./sw.js').then(r => { swReg = r; }).catch(() => {});

function controllaPromemoria(){
  const arr = sessioniSport();
  const daAvvisare = arr.filter(x => x.glicDopo == null && !x.avvisata && Date.now() >= scadenzaEsito(x));
  if(!daAvvisare.length) return;
  daAvvisare.forEach(x => { x.avvisata = true; });
  salvaSessioni(arr);
  const a = ATTIVITA[daAvvisare[daAvvisare.length-1].attivita] || {};
  if('Notification' in window && Notification.permission === 'granted' && swReg){
    swReg.showNotification("Com'è andata l'attività?", {
      body: `Inserisci la glicemia dopo ${a.nome ? a.nome.toLowerCase() : "l'attività"}: serve a tarare i parametri.`,
      icon: 'icona-192.png', badge: 'icona-192.png', tag: 'cho-esito'
    }).catch(() => {});
  }
  /* Il banner compare col ridisegno, ma non mentre si sta scrivendo. */
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(!S.nuovo && !S.pform && !S.sessioneAperta && !S.paramSport && tag !== 'INPUT' && tag !== 'TEXTAREA') disegna();
}
setInterval(controllaPromemoria, 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) controllaPromemoria(); });

/* ---------- trascinamento righe ingrediente ----------
   Il manico a sinistra di ogni riga si trascina col dito o col mouse:
   la riga segue il puntatore e al rilascio prende il posto calcolato,
   restando dentro la propria sezione. */
let dragIng = null;
document.addEventListener('pointerdown', e => {
  const manico = e.target.closest('[data-drag]');
  if(!manico || !S.rform) return;
  const riga = manico.closest('.rigaIng');
  if(!riga) return;
  e.preventDefault();
  const [s, k] = manico.dataset.drag.split(':').map(Number);
  dragIng = { s, k, riga, alt: riga.getBoundingClientRect().height + 6, y0: e.clientY, delta: 0 };
  riga.style.position = 'relative'; riga.style.zIndex = '5';
  riga.style.background = 'var(--bg)';
  riga.style.boxShadow = '0 10px 24px rgba(19,32,25,.28)';
  try{ manico.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', e => {
  if(!dragIng || !S.rform) return;
  const dy = e.clientY - dragIng.y0;
  const voci = S.rform.sezioni[dragIng.s] ? S.rform.sezioni[dragIng.s].voci : [];
  dragIng.delta = Math.max(-dragIng.k, Math.min(voci.length - 1 - dragIng.k, Math.round(dy / dragIng.alt)));
  dragIng.riga.style.transform = `translateY(${dy}px)`;
});
function fineDragIng(annulla){
  if(!dragIng) return;
  const { s, k, delta, riga } = dragIng;
  riga.style.transform = ''; riga.style.position = ''; riga.style.zIndex = '';
  riga.style.background = ''; riga.style.boxShadow = '';
  dragIng = null;
  if(!annulla && delta && S.rform && S.rform.sezioni[s]){
    const voci = S.rform.sezioni[s].voci;
    const [voce] = voci.splice(k, 1);
    voci.splice(k + delta, 0, voce);
    disegna();
  }
}
document.addEventListener('pointerup', () => fineDragIng(false));
document.addEventListener('pointercancel', () => fineDragIng(true));

/* ---------- interazioni ---------- */
