<style>
  :root{
    --bg:#F2F4F1; --card:#FFFFFF; --ink:#132019; --ink2:#4A5A50; --line:#DDE3DC;
    --cho:#0E7A57; --cho-soft:#E3F2EB; --wave:#A85B0C; --wave-soft:#FBEFDD;
    --sport:#4B4FB8; --sport-soft:#E8E9F8; --hypo:#B02418; --hypo-soft:#FBE7E4;
    --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    padding-top:env(safe-area-inset-top);
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:0;padding:20px 16px 8px}
  main{padding:0 16px 120px}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  input{font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px}
  .riga{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
  .riga .em{font-size:30px;line-height:1}
  .riga .nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .riga .sotto{font-size:12px;color:var(--ink2)}
  .cerca{position:relative;margin-bottom:12px}
  .cerca input{
    width:100%;padding:15px 16px 15px 44px;border-radius:18px;border:1px solid var(--line);
    background:var(--card);font-size:16px;color:var(--ink);outline:none
  }
  .cerca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink2)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;
    background:var(--card);border:1px solid var(--line);color:var(--ink2)
  }
  .chip.on{background:var(--c,var(--cho));border-color:var(--c,var(--cho));color:#fff;font-weight:600}
  .chips-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stella{padding:8px;color:#C3CCC5}
  .stella.on{color:var(--wave)}
  .num{font-variant-numeric:tabular-nums}

  .totale{background:var(--cho);color:#fff;border-radius:24px;padding:24px;text-align:center;margin-bottom:16px}
  .totale .big{font-size:64px;font-weight:800;line-height:1}
  .box{border-radius:24px;padding:20px;margin-bottom:16px}
  .avvisoBox{display:flex;gap:8px;font-size:14px;border-radius:18px;padding:14px;margin-bottom:16px;line-height:1.5}

  nav{
    position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20
  }
  nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);position:relative}
  nav button.on{color:var(--cho)}
  nav .lab{font-size:11px;font-weight:500}
  nav button.on .lab{font-weight:700}
  .badge{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--cho);color:#fff;font-size:10px;
    font-weight:700;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center}

  .velo{position:fixed;inset:0;background:rgba(19,32,25,.5);z-index:40;display:flex;align-items:flex-end}
  .foglio{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 20px 34px;max-height:88vh;overflow-y:auto}
  .stepper{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .stepper button{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600}
  .primario{width:100%;padding:16px;border-radius:18px;background:var(--cho);color:#fff;font-weight:700;font-size:17px}
  .centro{position:fixed;inset:0;background:rgba(19,32,25,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .modale{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%}
  ul{margin:8px 0 0;padding-left:18px}
  li{margin-bottom:8px;font-size:14px;line-height:1.5}
  p{line-height:1.55;margin:0 0 10px}
</style>
</head>

function calcolaBolo(cho, grassi, proteine, igPrevalente) {
  const kcalGP = grassi * 9 + proteine * 4;
  const ugp = kcalGP / 100;

  let tipo, split, durata, spiega;

  if (cho < 5 && ugp < 1) {
    tipo = "Nessun bolo per i carboidrati";
    split = null; durata = null;
    spiega = "Il pasto contiene pochissimi carboidrati e pochi grassi.";
  } else if (ugp < 1) {
    tipo = "Bolo immediato";
    split = null; durata = null;
    spiega = "Pasto magro: l'assorbimento è rapido e si concentra nella prima ora.";
  } else if (ugp < 2) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "3 ore";
    spiega = "Grassi e proteine rallentano lo svuotamento gastrico: una coda di insulina copre la seconda fase.";
  } else if (ugp < 3) {
    tipo = "Onda doppia";
    split = [60, 40]; durata = "4 ore";
    spiega = "Quantità importante di grassi e proteine: il rialzo tardivo è la parte più difficile da coprire.";
  } else if (ugp < 4) {
    tipo = "Onda doppia";
    split = [50, 50]; durata = "5 ore";
    spiega = "Pasto ricco e lento. Metà insulina subito, metà distribuita sulle ore successive.";
  } else {
    tipo = "Onda doppia lunga";
    split = [50, 50]; durata = "6-8 ore";
    spiega = "Pasto molto grasso e abbondante: l'effetto sulla glicemia può durare tutta la sera e la notte.";
  }

  // Pochi carboidrati ma molti grassi/proteine: la quota immediata serve poco.
  if (cho < 15 && ugp >= 2) {
    tipo = "Onda quadra";
    split = null; durata = "4-6 ore";
    spiega = "Quasi nessun carboidrato rapido, ma un grande carico di grassi e proteine che alza la glicemia in ritardo.";
  }

  let prebolo;
  if (tipo === "Nessun bolo per i carboidrati") prebolo = null;
  else if (ugp >= 2) prebolo = "0-10 minuti prima";
  else if (igPrevalente === "alto") prebolo = "15-20 minuti prima";
  else if (igPrevalente === "medio") prebolo = "10-15 minuti prima";
  else prebolo = "0-10 minuti prima";

  return { ugp, tipo, split, durata, prebolo, spiega };
}

/* ---------------------------------------------------------------
   LOGICA SPORT
   Fasce orientative di carboidrati aggiuntivi in base al tipo di
   attività, all'intensità, alla durata e all'insulina ancora attiva.
   --------------------------------------------------------------- */
function calcolaSport({ tipo, intensita, durata, bolo }) {
  const note = [];
  let prima = [0, 0], durante = 0, dopo = null;

  const fattoreInt = intensita === "leggera" ? 0.5 : intensita === "moderata" ? 1 : 1.4;
  const ore = durata / 60;

  if (tipo === "aerobica") {
    if (bolo === "attivo") {
      prima = [20, 40];
      note.push("Con insulina ancora attiva il rischio di ipoglicemia è alto: questi carboidrati vanno assunti senza bolo.");
      note.push("Se il microinfusore lo consente, valuta con il tuo team una basale temporanea ridotta impostata 60-90 minuti prima.");
    } else if (bolo === "digiuno") {
      prima = [0, 15];
      note.push("A digiuno la mattina presto molte persone non hanno bisogno di nulla per sessioni brevi e leggere.");
    } else {
      prima = [10, 20];
    }
    durante = ore > 1 ? Math.round(15 * fattoreInt * (ore - 0.5)) : 0;
    if (durata >= 90) note.push("Oltre l'ora e mezza conviene frazionare: piccole quantità ogni 30 minuti invece di una sola assunzione.");
  }

  if (tipo === "anaerobica") {
    prima = bolo === "attivo" ? [10, 20] : [0, 10];
    durante = 0;
    note.push("Forza e sforzi brevi e intensi spesso fanno salire la glicemia durante l'allenamento, per via degli ormoni dello stress.");
    note.push("Il calo può arrivare dopo, a distanza di ore: è quello il momento da presidiare.");
  }

  if (tipo === "mista") {
    prima = bolo === "attivo" ? [15, 30] : [10, 20];
    durante = ore >= 1 ? Math.round(12 * fattoreInt * ore) : 0;
    note.push("Negli sport di squadra le fasi si alternano: la glicemia può salire negli scatti e scendere nei recuperi lunghi.");
  }

  if (intensita === "intensa" && tipo !== "anaerobica") {
    note.push("Ad alta intensità il fabbisogno cresce ma l'assorbimento intestinale peggiora: meglio zuccheri liquidi che solidi.");
  }

  if (durata >= 60 || intensita === "intensa") {
    dopo = "Spuntino con carboidrati a lento assorbimento e una quota di proteine (per esempio pane integrale con formaggio, o yogurt con avena). La sensibilità all'insulina resta aumentata per molte ore e il rischio di ipoglicemia notturna è concreto.";
  } else {
    dopo = "Per sessioni brevi e leggere spesso non serve nulla, ma un controllo prima di dormire resta utile.";
  }

  return { prima, durante, dopo, note };
}

/* ---------- memoria sul telefono ---------- */
const CHIAVE = 'atlante-cho-v1';
function leggi(){ try{ return JSON.parse(localStorage.getItem(CHIAVE)) || {}; }catch(e){ return {}; } }
function scrivi(patch){ try{ localStorage.setItem(CHIAVE, JSON.stringify({...leggi(), ...patch})); }catch(e){} }

function esportaDati(){
  const blob = new Blob([JSON.stringify(leggi(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `atlante-cho-alimenti-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importaDati(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const dati = JSON.parse(r.result);
      if(!dati || typeof dati !== 'object' || Array.isArray(dati)) throw new Error();
      if('preferiti' in dati && !(Array.isArray(dati.preferiti) && dati.preferiti.every(x => typeof x === 'string'))) throw new Error();
      scrivi(dati);
      S.preferiti = leggi().preferiti || [];
      disegna();
      alert('Alimenti importati.');
    }catch(e){
      alert("Il file scelto non è un'esportazione valida di questa app.");
    }
  };
  r.readAsText(file);
}

function totali(){
  let cho=0,f=0,p=0,max=0,ig='medio',alcol=false;
  S.pasto.forEach(v => {
    const c = v.cibo.cho*v.g/100;
    cho+=c; f+=v.cibo.f*v.g/100; p+=v.cibo.p*v.g/100;
    if(c>max){ max=c; ig=v.cibo.ig; }
    if(v.cibo.alcol) alcol=true;
  });
  return {cho,f,p,ig,alcol};
}

    (S.aperto ? stratoPorzione() : '') + (leggi().avvisoVisto ? '' : stratoAvviso());
}

/* ---------- interazioni ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.classList.contains('velo') && e.target !== b) return;
  const [a, p1, p2] = b.dataset.a.split(':');

  if(a==='tab') S.tab = p1;
  else if(a==='cat') S.cat = p1;
  else if(a==='fav'){
    S.preferiti = S.preferiti.includes(p1) ? S.preferiti.filter(x=>x!==p1) : [...S.preferiti, p1];
    scrivi({preferiti: S.preferiti});
  }
  else if(a==='apri'){ S.aperto = p1; S.gr = cibo(p1).porz[0][1]; }
  else if(a==='chiudi') S.aperto = null;
  else if(a==='g'){ const passo = S.gr>=100?10:5; S.gr = p1==='+' ? S.gr+passo : Math.max(passo, S.gr-passo); }
  else if(a==='gset') S.gr = +p1;
  else if(a==='aggiungi'){ S.pasto.push({cibo: cibo(S.aperto), g: S.gr}); S.aperto = null; }
  else if(a==='togli') S.pasto.splice(+p1,1);
  else if(a==='svuota') S.pasto = [];
  else if(a==='sp'){ S.sport[p1] = isNaN(+p2) ? p2 : +p2; }
  else if(a==='esporta'){ esportaDati(); return; }
  else if(a==='importa'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => { if(inp.files[0]) importaDati(inp.files[0]); };
    inp.click();
    return;
  }
  else if(a==='ok') scrivi({avvisoVisto:true});
  disegna();
});

document.addEventListener('input', e => {
  if(e.target.id === 'q'){
    S.q = e.target.value;
    const v = document.getElementById('vista');
    v.innerHTML = vistaAtlante();
    const q = document.getElementById('q');
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
});

disegna();
</script>
</body>
</html>
