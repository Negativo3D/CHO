/* ---------- disegno ---------- */
const TABS = [['atlante','Home','casa'],['ricette','Ricette','libro'],['sport','Sport','sport']];
const TITOLI = {atlante:'CHO', ricette:'Ricettario', sport:'Attività fisica', peso:'Il tuo peso'};

function disegna(){
  document.body.dataset.tab = S.tab;
  const h = document.getElementById('titolo');
  h.textContent = TITOLI[S.tab];
  h.style.display = S.tab === 'atlante' ? 'none' : '';
  const v = document.getElementById('vista');
  /* Le animazioni d'ingresso partono solo cambiando schermata, non a ogni tocco. */
  v.classList.toggle('anim', S.tab !== disegna.ultimoTab);
  disegna.ultimoTab = S.tab;
  v.innerHTML = S.tab==='atlante' ? vistaAtlante()
    : S.tab==='ricette' ? vistaRicette() : S.tab==='peso' ? vistaPeso() : vistaSport();
  document.getElementById('nav').innerHTML = TABS.map(([id,l,i]) => `
    <button class="${S.tab===id || (id==='sport' && S.tab==='peso') ? 'on':''}" data-a="tab:${id}">
      <span class="ic">${ico(i)}</span><span class="lab">${l}</span>
    </button>`).join('');
  /* Ridisegnando un foglio aperto lo scorrimento resta dov'era:
     aggiungere o riordinare una riga non riporta in cima. */
  const fogli = document.querySelectorAll('#strati .foglio');
  const scorsa = fogli.length ? fogli[fogli.length - 1].scrollTop : 0;
  document.getElementById('strati').innerHTML =
    stratiHTML();
  if(scorsa){
    const dopo = document.querySelectorAll('#strati .foglio');
    if(dopo.length) dopo[dopo.length - 1].scrollTop = scorsa;
  }
  if(S.nuovo === 'barcode' && flussoCamera){
    const vd = document.getElementById('anteprima');
    if(vd && !vd.srcObject) vd.srcObject = flussoCamera;
  }
  /* Il lettore ZXing gestisce da solo il proprio <video>. */
}

/* ---------- trascinamento righe ingrediente ----------
   Il manico a sinistra di ogni riga si trascina col dito o col mouse:
   la riga segue il puntatore e al rilascio prende il posto calcolato,
   restando dentro la propria sezione. */
let dragIng = null;
document.addEventListener('pointerdown', e => {
  const manico = e.target.closest('[data-drag]');
  if(!manico || !S.rform) return;
  const riga = manico.closest('.rigaIng');
  if(!riga) return;
  e.preventDefault();
  const [s, k] = manico.dataset.drag.split(':').map(Number);
  dragIng = { s, k, riga, alt: riga.getBoundingClientRect().height + 6, y0: e.clientY, delta: 0 };
  riga.style.position = 'relative'; riga.style.zIndex = '5';
  riga.style.background = 'var(--bg)';
  riga.style.boxShadow = '0 10px 24px rgba(19,32,25,.28)';
  try{ manico.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', e => {
  if(!dragIng || !S.rform) return;
  const dy = e.clientY - dragIng.y0;
  const voci = S.rform.sezioni[dragIng.s] ? S.rform.sezioni[dragIng.s].voci : [];
  dragIng.delta = Math.max(-dragIng.k, Math.min(voci.length - 1 - dragIng.k, Math.round(dy / dragIng.alt)));
  dragIng.riga.style.transform = `translateY(${dy}px)`;
});
function fineDragIng(annulla){
  if(!dragIng) return;
  const { s, k, delta, riga } = dragIng;
  riga.style.transform = ''; riga.style.position = ''; riga.style.zIndex = '';
  riga.style.background = ''; riga.style.boxShadow = '';
  dragIng = null;
  if(!annulla && delta && S.rform && S.rform.sezioni[s]){
    const voci = S.rform.sezioni[s].voci;
    const [voce] = voci.splice(k, 1);
    voci.splice(k + delta, 0, voce);
    disegna();
  }
}
document.addEventListener('pointerup', () => fineDragIng(false));
document.addEventListener('pointercancel', () => fineDragIng(true));

/* ---------- interazioni ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.classList.contains('velo') && e.target !== b) return;
  const [a, p1, p2, p3] = b.dataset.a.split(':');

  if(a==='tab'){
    /* Rientrando in Sport si riparte sempre dal menu di scelta dell'attività. */
    if(p1 === 'sport' && S.tab !== 'sport'){ S.sport.attivita = null; S.sport.glic = ''; }
    S.paramSport = null; S.sessioneAperta = null;
    S.ricettaAperta = null; S.rform = null; S.editRicettaId = null;
    S.tab = p1;
  }
  else if(a==='cat') S.cat = p1;
  else if(a==='fav'){
    S.preferiti = S.preferiti.includes(p1) ? S.preferiti.filter(x=>x!==p1) : [...S.preferiti, p1];
    scrivi({preferiti: S.preferiti});
  }
  else if(a==='apri'){ S.aperto = p1; S.gr = cibo(p1).porz[0][1]; }
  else if(a==='chiudi') S.aperto = null;
  else if(a==='g'){
    const passo = S.gr>=100 ? 10 : S.gr>=25 ? 5 : S.gr>=5 ? 1 : 0.5;
    S.gr = Math.round((p1==='+' ? S.gr+passo : Math.max(0.5, S.gr-passo))*10)/10;
  }
  else if(a==='gset') S.gr = +p1;
  else if(a==='ricNuova'){
    S.rform = { n:'', foto:null, sezioni:[{ titolo:'', voci:[{ n:'', q:'', u:'g' }] }],
      passi:[{ titolo:'', passi:[{ t:'', foto:null }] }], cottura:[],
      porzG:'', perdita:'', ondaPct:'100', ondaOre:'' };
    S.editRicettaId = null;
  }
  else if(a==='rSezAdd'){ if(S.rform) S.rform.sezioni.push({ titolo:'', voci:[{ n:'', q:'', u:'g' }] }); }
  else if(a==='rSezDel'){ if(S.rform) S.rform.sezioni.splice(+p1, 1); }
  else if(a==='rIngAdd'){
    /* "+ ingrediente" apre subito il selettore dell'anagrafica sulla
       nuova riga; se si chiude senza scegliere, la riga vuota sparisce. */
    if(S.rform && S.rform.sezioni[+p1]){
      S.rform.sezioni[+p1].voci.push({ n:'', q:'', u:'g' });
      S.rIngPicker = { s:+p1, k: S.rform.sezioni[+p1].voci.length - 1, nuovo: true };
      S.rIngQ = '';
    }
  }
  else if(a==='rIngDel'){
    if(S.rform && S.rform.sezioni[+p1]){
      S.rform.sezioni[+p1].voci.splice(+p2, 1);
      if(!S.rform.sezioni[+p1].voci.length) S.rform.sezioni[+p1].voci.push({ n:'', q:'', u:'g' });
    }
  }
  else if(a==='rUnitaApri') S.rformUnita = S.rformUnita === p1 + ':' + p2 ? null : p1 + ':' + p2;
  else if(a==='rUnitaSet'){
    const v = S.rform && S.rform.sezioni[+p1] && S.rform.sezioni[+p1].voci[+p2];
    if(v && UNITA_RICETTA.includes(p3)){
      v.u = p3;
      if(v.u === 'qb') v.q = '';
    }
    S.rformUnita = null;
  }
  else if(a==='rPassoAdd'){ const l = gruppoPassi(p1); if(l) l.push({ t:'', foto:null }); }
  else if(a==='rPassoDel'){
    const l = gruppoPassi(p1);
    if(l){ l.splice(+p2, 1); if(p1 !== 'c' && !l.length) l.push({ t:'', foto:null }); }
  }
  else if(a==='rPrepSezAdd'){ if(S.rform) S.rform.passi.push({ titolo:'', passi:[{ t:'', foto:null }] }); }
  else if(a==='rPrepSezDel'){
    if(S.rform){ S.rform.passi.splice(+p1, 1);
      if(!S.rform.passi.length) S.rform.passi.push({ titolo:'', passi:[{ t:'', foto:null }] }); }
  }
  else if(a==='rPassoFoto'){
    const l = gruppoPassi(p1), k = +p2;
    if(l) scegliFoto(d => { if(S.rform && l[k]){ l[k].foto = d; disegna(); } });
    return;
  }
  else if(a==='rPassoFotoX'){ const l = gruppoPassi(p1); if(l && l[+p2]) l[+p2].foto = null; }
  else if(a==='ricApri'){ S.ricettaAperta = p1; S.ricettaEspansi = { ing: true, prep: true }; }
  else if(a==='usoRicetta'){ S.uso = null; S.ricettaAperta = p1; S.ricettaEspansi = { ing: true, prep: true }; }
  else if(a==='ricEsp'){ S.ricettaEspansi = S.ricettaEspansi || {}; S.ricettaEspansi[p1] = !S.ricettaEspansi[p1]; }
  else if(a==='ricChiudi') S.ricettaAperta = null;
  else if(a==='ricAnnulla'){ S.rform = null; S.editRicettaId = null; }
  else if(a==='ricModifica'){
    const r = RICETTE.find(x => x.id === p1);
    if(r){
      S.rform = { n:r.n, foto:r.foto,
        sezioni: r.sezioni.length
          ? r.sezioni.map(sz => ({ titolo:sz.titolo, voci: sz.voci.length ? sz.voci.map(v => ({...v})) : [{ n:'', q:'' }] }))
          : [{ titolo:'', voci:[{ n:'', q:'', u:'g' }] }],
        passi: r.passi.length
          ? r.passi.map(sz => ({ titolo: sz.titolo, passi: sz.passi.length ? sz.passi.map(x => ({...x})) : [{ t:'', foto:null }] }))
          : [{ titolo:'', passi:[{ t:'', foto:null }] }],
        cottura: r.cottura.map(x => ({...x})),
        ...(() => { const pl = PIATTI.find(x => x.daRicetta === r.id) || {};
          return { porzG: pl.porzG ? String(pl.porzG) : '',
            perdita: pl.perdita ? String(pl.perdita) : '',
            ondaPct: String(pl.ondaPct || 100),
            ondaOre: pl.ondaOre ? String(pl.ondaOre).replace('.', ',') : '' }; })() };
      S.editRicettaId = p1; S.ricettaAperta = null;
    }
  }
  else if(a==='ricElimina'){
    const r = RICETTE.find(x => x.id === p1);
    if(r && confirm(`Eliminare la ricetta "${r.n}"?`)){
      RICETTE = RICETTE.filter(x => x.id !== p1);
      PIATTI = PIATTI.filter(pl => pl.daRicetta !== p1);
      scrivi({ ricette: RICETTE, piatti: PIATTI });
      S.ricettaAperta = null; S.rform = null; S.editRicettaId = null;
    }
  }
  else if(a==='ricSalva'){ salvaRicetta(); return; }
  else if(a==='rIngScegli'){ S.rIngPicker = { s:+p1, k:+p2 }; S.rIngQ = ''; }
  else if(a==='ripChiudi'){
    const p = S.rIngPicker;
    if(p && p.nuovo && S.rform && S.rform.sezioni[p.s]){
      const v = S.rform.sezioni[p.s].voci[p.k];
      if(v && !v.n.trim()) S.rform.sezioni[p.s].voci.splice(p.k, 1);
    }
    S.rIngPicker = null;
  }
  else if(a==='ripSet'){
    const f = cibo(p1);
    const p = S.rIngPicker;
    const v = p && S.rform && S.rform.sezioni[p.s] && S.rform.sezioni[p.s].voci[p.k];
    if(f && v) v.n = f.n;
    S.rIngPicker = null;
    disegna();
    /* Cursore dritto sulla quantità: senza grammi la voce non conta. */
    const q = v ? document.getElementById(`ri-${p.s}-${p.k}-q`) : null;
    if(q) q.focus();
    return;
  }
  else if(a==='ricFoto'){ fotoRicetta(); return; }
  else if(a==='ricFotoX'){ if(S.rform) S.rform.foto = null; }
  else if(a==='sp'){ S.sport[p1] = isNaN(+p2) ? p2 : +p2; }
  else if(a==='att'){
    /* Si riparte senza condizione né glicemia: la proposta arriva solo
       quando entrambe sono compilate. */
    S.sport.attivita = p1 || null;
    S.sport.cond = null; S.sport.glic = ''; S.sportAvviata = null;
  }
  else if(a==='param') S.paramSport = p1;
  else if(a==='chiudiParam') S.paramSport = null;
  else if(a==='paramApp'){ S.paramApp = true; S.pw = { vecchia:'', nuova:'' }; }
  else if(a==='chiudiParamApp'){ S.paramApp = null; S.pw = null; }
  else if(a==='pwAttiva'){ pwAttiva(); return; }
  else if(a==='pwCambia'){ pwCambiaTogli(false); return; }
  else if(a==='pwTogli'){ pwCambiaTogli(true); return; }
  else if(a==='avviaSport'){
    /* Registra subito con quanto impostato nella pagina: condizione,
       glicemia dichiarata e CHO suggeriti. Nessun altro passaggio:
       l'esito arriverà col promemoria. */
    const att = ATTIVITA[S.sport.attivita] || ATTIVITA.nuoto;
    const r = calcolaSport(S.sport);
    if(!r.pronto){
      alert(`Prima scegli ${att.cond === 'Distanza' ? 'la distanza' : 'la durata'} e inserisci la glicemia.`);
      return;
    }
    const arr = sessioniSport();
    const rec = { id:nuovoId(), quando:Date.now(), attivita:S.sport.attivita, cond:S.sport.cond,
      suggPrima:r.prima, correzione:r.correzione || 0,
      anticipo: r.basale ? r.basale.anticipo : 0,
      ...(r.bolo ? { bolo:true, boloU:r.bolo.unita } : {}),
      presiPrima:r.prima, presiDurante:0,
      glicPrima: Math.round(parseFloat(String(S.sport.glic).replace(',', '.'))),
      glicDopo:null, esito:null, nota:null };
    arr.push(rec);
    salvaSessioni(arr);
    S.sportAvviata = rec.id;
    if('Notification' in window && Notification.permission === 'default')
      Notification.requestPermission().catch(() => {});
  }
  else if(a==='esitoSport'){
    const x = sessioniSport().find(v => v.id === p1);
    if(x) S.sessioneAperta = { ...x, nuova:false, cond: x.cond ?? x.durata ?? null,
      presiPrima:String(x.presiPrima), presiDurante:String(x.presiDurante), glicDopo:'' };
  }
  else if(a==='chiudiSessione') S.sessioneAperta = null;
  else if(a==='salvaSessione'){ salvaSessione(); return; }
  else if(a==='nuovo') S.nuovo = 'scegli';
  else if(a==='nuovoAlimento') S.nuovo = 'menu';
  else if(a==='vedi') S.vedi = p1;
  else if(a==='pulisciQ' || a==='pulisciQr'){
    /* La x svuota la ricerca e lascia il focus nel campo, pronto per
       una nuova digitazione; si ridisegna solo la vista. */
    if(a==='pulisciQ') S.q = ''; else S.qr = '';
    const v = document.getElementById('vista');
    v.classList.remove('anim');
    v.innerHTML = a==='pulisciQ' ? vistaAtlante() : vistaRicette();
    const el = document.getElementById(a==='pulisciQ' ? 'q' : 'qr');
    if(el) el.focus();
    return;
  }
  else if(a==='chiudiNuovo'){ fermaScanner(); S.nuovo = null; S.form = null; S.editId = null; S.caricamento = false; }
  else if(a==='nuovoForm'){ S.form = formVuoto(); S.editId = null; S.nuovo = 'form'; }
  else if(a==='nuovoBarcode'){ S.nuovo = 'barcode'; S.codice = ''; S.caricamento = false; avviaScanner(); }
  else if(a==='nuovoFoto'){ fotoBarcode(); return; }
  else if(a==='ffoto'){ fotoAlimento(); return; }
  else if(a==='ffotoX'){ if(S.form) S.form.foto = null; }
  else if(a==='cercaCodice'){ fermaScanner(); cercaCodice(S.codice); return; }
  else if(a==='salvaAlimento'){ salvaAlimento(); return; }
  else if(a==='fset'){ if(S.form) S.form[p1] = p2; }
  else if(a==='modifica'){
    const f = cibo(p1);
    if(f){
      S.form = { n:f.n, e:f.e, cho:String(f.cho), f:String(f.f), p:String(f.p),
        ig:f.ig, alcol:f.alcol ? 'si' : 'no', cat:f.cat || 'Altro', foto: f.foto || null,
        ondaPct: String(f.ondaPct || 100), ondaOre: f.ondaOre ? String(f.ondaOre).replace('.', ',') : '',
        porz: f.porz[0][1] !== 100 ? String(f.porz[0][1]) : '' };
      S.editId = p1; S.nuovo = 'form'; S.aperto = null;
    }
  }
  else if(a==='elimina'){
    const f = cibo(p1);
    const usato = PIATTI.some(pl => pl.ing.some(i => i.alimento === p1));
    if(f && confirm(`Eliminare "${f.n}" dai tuoi alimenti?${usato ? ' Verrà tolto anche dai piatti che lo usano.' : ''}`)){
      FOODS = FOODS.filter(x => x.id !== p1);
      S.preferiti = S.preferiti.filter(x => x !== p1);
      PIATTI = PIATTI.map(pl => ({...pl, ing: pl.ing.filter(i => i.alimento !== p1)})).filter(pl => pl.ing.length);
      scrivi({ alimenti: FOODS, preferiti: S.preferiti, piatti: PIATTI });
      S.aperto = null;
      if(S.cat !== 'Tutti' && S.cat !== 'Preferiti' && !FOODS.some(x => x.cat === S.cat)) S.cat = 'Tutti';
    }
  }
  else if(a==='nuovoPiatto'){
    if(!FOODS.length){ alert('Prima aggiungi qualche alimento alla tua anagrafica: i piatti si compongono da lì.'); return; }
    S.nuovo = null;
    S.pform = { n:'', e:'', foto:null, ing:[], porzG:'', perdita:'', ondaPct:'100', ondaOre:'' }; S.editPiattoId = null; S.pingQ = '';
  }
  else if(a==='apriPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl){
      S.uso = { id: pl.id };
      const pesoCotto = pl.ing.reduce((s,i) => s + grIng(i), 0) * (1 - (pl.perdita || 0)/100);
      S.usoG = Math.min(pl.porzG || 350, Math.round(pesoCotto*10)/10);
    }
  }
  else if(a==='chiudiPiatto'){ S.uso = null; S.pform = null; S.editPiattoId = null; S.pingQ = ''; }
  else if(a==='ug'){
    const passo = S.usoG >= 100 ? 10 : S.usoG >= 25 ? 5 : S.usoG >= 5 ? 1 : 0.5;
    S.usoG = Math.round((p1==='+' ? S.usoG+passo : Math.max(0.5, S.usoG-passo))*10)/10;
  }
  else if(a==='ugset') S.usoG = +p1;
  else if(a==='modificaPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl){ S.pform = { n:pl.n, e:pl.e, foto:pl.foto, ing: pl.ing.map(i => ({...i})),
      porzG: pl.porzG ? String(pl.porzG) : '',
      perdita: pl.perdita ? String(pl.perdita) : '',
      ondaPct: String(pl.ondaPct || 100), ondaOre: pl.ondaOre ? String(pl.ondaOre).replace('.', ',') : '',
      daRicetta: pl.daRicetta, mancanti: pl.mancanti }; S.editPiattoId = p1; S.uso = null; S.pingQ = ''; }
  }
  else if(a==='eliminaPiatto'){
    const pl = PIATTI.find(x => x.id === p1);
    if(pl && confirm(`Eliminare il piatto "${pl.n}"?`)){
      PIATTI = PIATTI.filter(x => x.id !== p1);
      scrivi({ piatti: PIATTI });
      S.uso = null;
    }
  }
  else if(a==='pfoto'){ fotoPiatto(); return; }
  else if(a==='pfotoX'){ if(S.pform) S.pform.foto = null; }
  else if(a==='pingAdd'){
    const c = cibo(p1);
    if(c && S.pform && !S.pform.ing.some(i => i.alimento === c.id)){
      S.pform.ing.push({ alimento:c.id, modo:'g', g: c.porz[0][1] });
      S.pingQ = '';
    }
  }
  else if(a==='pingTogli'){ if(S.pform) S.pform.ing.splice(+p1, 1); }
  else if(a==='pingModo'){
    const i = S.pform && S.pform.ing[+p1];
    if(i && i.modo !== p2){
      if(p2 === 'pezzi'){ i.modo = 'pezzi'; i.pezzi = 1; i.gPezzo = +i.g > 0 ? i.g : 100; delete i.g; }
      else { i.modo = 'g'; i.g = +i.pezzi > 0 && +i.gPezzo > 0 ? Math.round(i.pezzi*i.gPezzo*10)/10 : 100; delete i.pezzi; delete i.gPezzo; }
    }
  }
  else if(a==='salvaPiatto'){ salvaPiatto(); return; }
  else if(a==='pesoSalva'){
    const kg = Math.round(parseFloat(String(S.pesoKg).replace(',','.'))*10)/10;
    if(!(kg >= 20 && kg <= 300)){ alert('Inserisci un peso in chilogrammi, ad esempio 78,4.'); return; }
    const t = `${S.pesoData}T${S.pesoOra || '12:00'}`;
    if(isNaN(new Date(t))){ alert('Controlla data e ora.'); return; }
    PESO = [...PESO, { t, kg }].sort((x,y) => new Date(x.t) - new Date(y.t));
    scrivi({ peso: PESO });
    S.pesoKg = ''; S.pesoData = ''; S.pesoOra = ''; S.pesoTip = null;
  }
  else if(a==='pesoTogli'){
    const v = PESO[+p1];
    if(v && confirm(`Eliminare la misurazione del ${new Date(v.t).toLocaleDateString('it-IT')} (${gr1(v.kg)} kg)?`)){
      PESO.splice(+p1, 1);
      scrivi({ peso: PESO });
      S.pesoTip = null;
    }
  }
  else if(a==='pesoRange'){ S.pesoRange = p1; S.pesoTip = null; }
  else if(a==='pesoTip') S.pesoTip = S.pesoTip === +p1 ? null : +p1;
  else if(a==='esporta'){ esportaDati(); return; }
  else if(a==='ok') scrivi({avvisoVisto:true});
  disegna();
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if(id === 'q'){
    S.q = e.target.value;
    const v = document.getElementById('vista');
    /* Niente animazioni d'ingresso mentre si scrive: ripartirebbero a
       ogni tasto con un effetto a scatti. */
    v.classList.remove('anim');
    v.innerHTML = vistaAtlante();
    const q = document.getElementById('q');
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
  else if(id === 'qr'){
    S.qr = e.target.value;
    const v = document.getElementById('vista');
    v.classList.remove('anim');
    v.innerHTML = vistaRicette();
    const el = document.getElementById('qr');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  else if(id === 'rf-n' && S.rform) S.rform.n = e.target.value;
  else if((id === 'rf-porzG' || id === 'rf-perdita' || id === 'rf-ondaPct' || id === 'rf-ondaOre') && S.rform)
    S.rform[id.slice(3)] = e.target.value;
  else if(id.startsWith('rsez-') && S.rform){
    const sz = S.rform.sezioni[+id.slice(5)];
    if(sz) sz.titolo = e.target.value;
  }
  else if(id === 'rip-q' && S.rIngPicker){
    S.rIngQ = e.target.value;
    document.getElementById('strati').innerHTML = stratiHTML();
    const c = document.getElementById('rip-q');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }
  else if(id.startsWith('ri-') && S.rform){
    const [, s, k, campo] = id.split('-');
    const v = S.rform.sezioni[+s] && S.rform.sezioni[+s].voci[+k];
    if(v && campo === 'q') v.q = e.target.value;
  }
  else if(id.startsWith('rpsez-') && S.rform){
    const sz = S.rform.passi[+id.slice(6)];
    if(sz) sz.titolo = e.target.value;
  }
  else if(id.startsWith('rp-') && S.rform){
    const [, g, k] = id.split('-');
    const l = gruppoPassi(g);
    if(l && l[+k]) l[+k].t = e.target.value;
  }
  else if(id === 'fbarcode') S.codice = e.target.value;
  else if(id.startsWith('fi-') && S.form) S.form[id.slice(3)] = e.target.value;
  else if(id === 'ss-prima' && S.sessioneAperta) S.sessioneAperta.presiPrima = e.target.value;
  else if(id === 'ss-glic' && S.sessioneAperta) S.sessioneAperta.glicDopo = e.target.value;
  else if(id === 'ss-glicprima' && S.sessioneAperta) S.sessioneAperta.glicPrima = e.target.value;
  else if(id === 'sp-glic'){
    /* La proposta si aggiorna dal vivo, senza ridisegnare la pagina
       (il campo perderebbe il focus mentre si scrive). */
    S.sport.glic = e.target.value;
    const box = document.getElementById('r-box');
    const att = ATTIVITA[S.sport.attivita];
    if(box && att) box.outerHTML = boxPrima(calcolaSport(S.sport), att);
  }
  else if(id.startsWith('pg-')) salvaGlicParam(id.slice(3), e.target.value);
  else if(id.startsWith('pa-')) salvaAppParam(id.slice(3), e.target.value);
  else if((id === 'pw-vecchia' || id === 'pw-nuova') && S.pw) S.pw[id.slice(3)] = e.target.value;
  else if(id.startsWith('pt-') && S.paramSport){
    /* Cella della tabella parametri: si salva subito, senza ridisegnare
       (il ridisegno farebbe perdere il focus mentre si scrive). */
    const [, sez, riga, col] = id.split('-');
    salvaCella(S.paramSport, sez, riga, col, e.target.value);
  }
  else if(id === 'peso-data') S.pesoData = e.target.value;
  else if(id === 'peso-ora') S.pesoOra = e.target.value;
  else if(id === 'peso-kg') S.pesoKg = e.target.value;
  else if(id === 'pf-n' && S.pform) S.pform.n = e.target.value;
  else if(id === 'pf-porzG' && S.pform) S.pform.porzG = e.target.value;
  else if(id === 'pf-perdita' && S.pform) S.pform.perdita = e.target.value;
  else if(id === 'pf-ondaPct' && S.pform) S.pform.ondaPct = e.target.value;
  else if(id === 'pf-ondaOre' && S.pform) S.pform.ondaOre = e.target.value;
  else if(id === 'pf-cerca' && S.pform){
    S.pingQ = e.target.value;
    document.getElementById('strati').innerHTML = stratiHTML();
    const c = document.getElementById('pf-cerca');
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }
  else if(id.startsWith('pi-') && S.pform){
    const [, tipo, k] = id.split('-');
    const i = S.pform.ing[+k];
    if(i){
      const v = parseFloat(String(e.target.value).replace(',','.'));
      const num = isFinite(v) ? v : 0;
      if(tipo === 'g') i.g = num;
      else if(tipo === 'pz') i.pezzi = num;
      else if(tipo === 'gp') i.gPezzo = num;
    }
  }
});

/* Allineamento iniziale: ogni ricetta esistente genera il suo piatto
   (una sola volta; poi ci pensa il salvataggio della ricetta). */
if(!leggi().ricettePiatti1){
  RICETTE.forEach(sincronizzaPiattoRicetta);
  scrivi({ ricettePiatti1: true });
}

/* Una tantum: gli ingredienti in grammi delle ricette già salvate che
   mancano dall'anagrafica vengono creati "da completare" e i piatti
   collegati riabbinati, così nulla resta fuori anagrafica. */
if(!leggi().ricetteAlimenti1){
  const creati = RICETTE.reduce((t, r) => t + creaAlimentiRicetta(r), 0);
  if(creati) RICETTE.forEach(sincronizzaPiattoRicetta);
  scrivi({ ricetteAlimenti1: true });
}

/* Una tantum: valori nutrizionali per 100 g degli alimenti creati
   dalla ricetta delle lasagne (valori indicativi da tabelle di
   composizione, da verificare sull'etichetta dei propri prodotti).
   Si completano solo quelli ancora segnati "da completare", così le
   modifiche fatte a mano non vengono toccate. */
const VALORI_LASAGNE = {
    "Lasagne fresche all'uovo": { e:'🍝', cho:53, f:2.2, p:9.9, ig:'medio', cat:'Primi e patate' },
    'Scamorza (provola)':      { e:'🧀', cho:1,   f:25,  p:25,  ig:'basso', cat:'Latte e derivati' },
    'Formaggio grattugiato':   { e:'🧀', cho:1,   f:28,  p:33,  ig:'basso', cat:'Latte e derivati' },
    'Passata di pomodoro':     { e:'🍅', cho:4,   f:0.4, p:1.3, ig:'basso', cat:'Verdura e legumi' },
    'Funghi champignon':       { e:'🍄', cho:1,   f:0.3, p:3,   ig:'basso', cat:'Verdura e legumi' },
    'Zucchine':                { e:'🥒', cho:2,   f:0.2, p:1.3, ig:'basso', cat:'Verdura e legumi' },
    'Spinaci':                 { e:'🥬', cho:2,   f:0.4, p:3,   ig:'basso', cat:'Verdura e legumi' },
    'Cipolle rosse':           { e:'🧅', cho:6,   f:0.1, p:1,   ig:'basso', cat:'Verdura e legumi' },
    'Carote':                  { e:'🥕', cho:7,   f:0.2, p:1,   ig:'basso', cat:'Verdura e legumi' },
    'Farina 00':               { e:'🌾', cho:73,  f:1,   p:11,  ig:'alto',  cat:'Pane e cereali' },
    'Burro':                   { e:'🧈', cho:1,   f:83,  p:1,   ig:'basso', cat:'Latte e derivati' },
    'Melanzane':               { e:'🍆', cho:2.6, f:0.4, p:1.1, ig:'basso', cat:'Verdura e legumi' }
};
if(!leggi().alimentiLasagne1){
  let toccati = 0;
  for(const [nome, v] of Object.entries(VALORI_LASAGNE)){
    const i = FOODS.findIndex(f => norm(f.n) === norm(nome));
    if(i >= 0){
      if(FOODS[i].daCompletare){
        FOODS[i] = sanificaAlimento({ ...FOODS[i], ...v, daCompletare: false });
        toccati++;
      }
    } else if(nome === 'Melanzane'){
      const nuovo = sanificaAlimento({ n: nome, ...v });
      if(nuovo){ FOODS.push(nuovo); toccati++; }
    }
  }
  if(toccati) scrivi({ alimenti: FOODS });
  scrivi({ alimentiLasagne1: true });
}

/* Una tantum, seconda passata: sui dispositivi dove la ricetta era
   stata seminata con nomi un po' diversi, gli alimenti creati erano
   rimasti "da completare" (il completamento andava per nome esatto).
   Qui si riconoscono per parola chiave e si completano; alle
   melanzane rimaste senza grammatura in ricetta si danno 200 g. */
if(!leggi().lasagneRitocchi1){
  const PAROLE = [
    ['lasagn', "Lasagne fresche all'uovo"], ['scamorza', 'Scamorza (provola)'], ['provola', 'Scamorza (provola)'],
    ['grattugiat', 'Formaggio grattugiato'], ['parmigiano', 'Formaggio grattugiato'], ['grana', 'Formaggio grattugiato'],
    ['passata', 'Passata di pomodoro'], ['pomodor', 'Passata di pomodoro'],
    ['fungh', 'Funghi champignon'], ['champignon', 'Funghi champignon'],
    ['zucchin', 'Zucchine'], ['spinac', 'Spinaci'], ['cipoll', 'Cipolle rosse'], ['carot', 'Carote'],
    ['farina', 'Farina 00'], ['burro', 'Burro'], ['melanzan', 'Melanzane']
  ];
  let toccati = 0;
  for(let i = 0; i < FOODS.length; i++){
    if(!FOODS[i].daCompletare) continue;
    const nf = norm(FOODS[i].n);
    const hit = PAROLE.find(([p]) => nf.includes(p));
    if(hit){
      FOODS[i] = sanificaAlimento({ ...FOODS[i], ...VALORI_LASAGNE[hit[1]], daCompletare: false });
      toccati++;
    }
  }
  if(toccati) scrivi({ alimenti: FOODS });
  let toccaRicette = false;
  for(const r of RICETTE) for(const sez of r.sezioni) for(const v of sez.voci){
    const g = parseFloat(String(v.q).replace(',', '.'));
    if((v.u || 'g') === 'g' && !(g > 0) && norm(v.n).includes('melanzan')){ v.q = '200'; toccaRicette = true; }
  }
  if(toccaRicette) scrivi({ ricette: RICETTE });
  /* Riabbinamento comunque: ripara anche eventuali abbinamenti storti
     fatti quando il confronto andava per sottostringa. */
  RICETTE.forEach(sincronizzaPiattoRicetta);
  scrivi({ lasagneRitocchi1: true });
}

/* Una tantum: da qui in poi gli ingredienti delle ricette sono
   vincolati per nome esatto agli alimenti in anagrafica (niente più
   regole elastiche né testo libero). Le voci che si abbinavano per
   somiglianza prendono il nome esatto dell'alimento; quelle senza
   nessun alimento vengono create col loro nome, così le ricette già
   salvate restano valide e salvabili con la nuova regola. */
if(!leggi().abbinamentoEsatto1){
  const sp = s => ' ' + s + ' ';
  let tocca = false;
  for(const r of RICETTE) for(const sez of r.sezioni) for(const v of sez.voci){
    if(!v.n.trim() || trovaAlimento(v.n)) continue;
    const nn = norm(v.n);
    const c = FOODS.find(f => sp(nn).includes(sp(norm(f.n))) || sp(norm(f.n)).includes(sp(nn)));
    if(c) v.n = c.n;
    else {
      const g = parseFloat(String(v.q).replace(',', '.'));
      const conta = (v.u || 'g') === 'g' && g > 0;
      const nuovo = sanificaAlimento({ n: v.n, cho: 0, cat: 'Altro', daCompletare: conta });
      if(nuovo) FOODS.push(nuovo);
    }
    tocca = true;
  }
  if(tocca) scrivi({ ricette: RICETTE, alimenti: FOODS });
  RICETTE.forEach(sincronizzaPiattoRicetta);
  scrivi({ abbinamentoEsatto1: true });
}

  scrivi({ porzLasagne1: true });

/* ---------- importazione di ricettari ----------
   Importa una tantum (per chiave) un pacchetto di alimenti e ricette:
   gli alimenti mancanti vengono creati completi di valori per 100 g,
   le ricette aggiunte se non esistono già (con piatto generato,
   porzione, perdita in cottura e onda quadra se indicate). Serve per
   i ricettari tematici, come quello coreano. */
function importaRicettario(chiave, alimenti, ricette){
  if(leggi()[chiave]) return;
  let toccaAlimenti = false;
  for(const a of (alimenti || [])){
    if(FOODS.some(f => norm(f.n) === norm(a.n))) continue;
    const nuovo = sanificaAlimento(a);
    if(nuovo){ FOODS.push(nuovo); toccaAlimenti = true; }
  }
  if(toccaAlimenti) scrivi({ alimenti: FOODS });
  let nuove = false;
  for(const r of (ricette || [])){
    if(RICETTE.some(x => norm(x.n) === norm(r.n))) continue;
    const dati = sanificaRicetta(r);
    if(!dati) continue;
    RICETTE.push(dati);
    sincronizzaPiattoRicetta(dati);
    const i = PIATTI.findIndex(pl => pl.daRicetta === dati.id);
    if(i >= 0 && (r.porzG || r.perdita || r.ondaPct)){
      const agg = sanificaPiatto({ ...PIATTI[i],
        porzG: r.porzG, perdita: r.perdita, ondaPct: r.ondaPct, ondaOre: r.ondaOre });
      if(agg) PIATTI[i] = agg;
    }
    nuove = true;
  }
  if(nuove) scrivi({ ricette: RICETTE, piatti: PIATTI });
  scrivi({ [chiave]: true });
}

/* Una tantum: chi ha l'anagrafica seminata quando la base non aveva
   ancora grassi e proteine se li ritrova salvati a zero. Si completano
   con i valori della base attuale, riconoscendoli per nome e solo se
   entrambi sono a zero: i carboidrati e le modifiche manuali restano. */
if(!leggi().alimentiBase1){
  let toccati = 0;
  for(const b of ALIMENTI_BASE){
    const i = FOODS.findIndex(f => norm(f.n) === norm(b.n));
    if(i >= 0 && FOODS[i].f === 0 && FOODS[i].p === 0){
      FOODS[i] = sanificaAlimento({ ...FOODS[i], f: b.f, p: b.p, ig: FOODS[i].ig || b.ig });
      toccati++;
    }
  }
  if(toccati) scrivi({ alimenti: FOODS });
  scrivi({ alimentiBase1: true });
}

   all'uovo, non la secca. Si rinomina l'alimento tenendo lo stesso id
   (così il piatto resta collegato), coi valori dell'etichetta

   nome anche nella ricetta. */

  if(i >= 0){
    FOODS[i] = sanificaAlimento({ ...FOODS[i], n: "Lasagne fresche all'uovo",
      e: '🍝', cho: 53, f: 2.2, p: 9.9, ig: 'medio', cat: 'Primi e patate', daCompletare: false });
    scrivi({ alimenti: FOODS });
  }
  let toccaRicette = false;
  for(const r of RICETTE) for(const sez of r.sezioni) for(const v of sez.voci)
    if(norm(v.n) === norm("Lasagne all'uovo secche")){ v.n = "Lasagne fresche all'uovo"; toccaRicette = true; }
  if(toccaRicette){ scrivi({ ricette: RICETTE }); RICETTE.forEach(sincronizzaPiattoRicetta); }
  scrivi({ lasagneFresche1: true });
}

/* ---------- blocco all'avvio ----------
   Se la password è attiva, un velo pieno copre l'app finché non viene
   inserita quella giusta. Lo splash gli sta sopra e poi si dissolve. */
(function(){
  const acc = leggi().accesso;
  if(!acc || !acc.hash) return;
  const b = document.createElement('div');
  b.id = 'blocco';
  b.innerHTML = `
    <div style="font-size:44px;line-height:1">🔒</div>
    <div style="color:#fff;font-weight:800;font-size:24px;letter-spacing:-.5px">CHO</div>
    <div style="color:#CFEBDD;font-size:13px;margin-bottom:6px">Inserisci la password per entrare</div>
    <input id="pw-accesso" type="password" autocomplete="current-password" aria-label="Password">
    <button id="pw-entra">Entra</button>
    <div id="pw-msg" style="color:#FFD9D2;font-size:13px;font-weight:600;min-height:18px"></div>`;
  document.body.appendChild(b);
  const inp = b.querySelector('#pw-accesso'), msg = b.querySelector('#pw-msg');
  const prova = async () => {
    if(await hashPw(inp.value, acc.sale) === acc.hash) b.remove();
    else{ msg.textContent = 'Password sbagliata, riprova.'; inp.value = ''; inp.focus(); }
  };
  b.querySelector('#pw-entra').addEventListener('click', prova);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') prova(); });
})();

/* ---------- splash di avvio ----------
   La schermata è già visibile dal primo istante (è HTML statico prima
   dell'app): qui si lascia solo il tempo di godersi l'animazione e poi
   la si dissolve. Con "riduci movimento" attivo sparisce quasi subito. */
(function(){
  const sp = document.getElementById('splash');
  if(!sp) return;
  const veloce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => {
    sp.classList.add('via');
    setTimeout(() => sp.remove(), 600);
  }, veloce ? 250 : 1700);
})();

/* ---------- controllo aggiornamenti ----------
   La shortcut in home spesso riapre la pagina rimasta in memoria senza
   ricaricarla, e GitHub Pages tiene la pagina in cache ~10 minuti: qui
   si controlla la versione online (all'avvio, quando l'app torna in
   primo piano e ogni 15 minuti) e, se è diversa, compare un banner che
   ricarica la pagina scavalcando la cache. */
async function controllaAggiornamenti(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch(location.pathname + '?agg=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/VERSIONE = '([^']+)'/);
    if(m && m[1] !== VERSIONE) mostraBannerAggiorna();
  }catch(e){}
}
function mostraBannerAggiorna(){
  if(document.getElementById('agg')) return;
  const b = document.createElement('button');
  b.id = 'agg';
  b.textContent = '✨ Nuova versione disponibile — tocca per aggiornare';
  b.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;z-index:60;' +
    'padding:14px;border-radius:18px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;' +
    'box-shadow:0 10px 30px rgba(19,32,25,.35);animation:su .4s ease both';
  b.onclick = () => location.replace(location.pathname + '?v=' + Date.now());
  document.body.appendChild(b);
}
controllaAggiornamenti();
document.addEventListener('visibilitychange', () => { if(!document.hidden) controllaAggiornamenti(); });
setInterval(controllaAggiornamenti, 15 * 60 * 1000);
